<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمایشگاه VuraVision — یادگیری تعاملی فیزیک، شیمی، ریاضی و آمار</title>


<style>
:root{
  --bg:#151030; --surface:#1E1847; --raised:#2F2765; --brandOrange:#F7941D;
  --text:#FFFFFF; --text2:rgba(255,255,255,.65);
  --border:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:'Vazirmatn','Noto Sans Arabic',Tahoma,system-ui,sans-serif;
  font-size:18px; line-height:1.75; overflow-x:hidden;
}
.wrap{max-width:1180px;margin:0 auto;padding:28px 28px 56px}
header{display:flex;align-items:center;gap:18px;padding:8px 2px 20px}
.logo{width:52px;height:52px;border-radius:12px;flex:none;background:#231C55;border:1px solid var(--border);display:grid;place-items:center}
.logo svg{width:34px;height:30px;display:block}
.brandrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wordmark{font-family:Georgia,serif;font-size:12px;letter-spacing:3px;color:var(--brandOrange);font-weight:700;direction:ltr}
header h1{font-size:24px;font-weight:800;letter-spacing:-.2px}
header p{font-size:16px;color:var(--text2);margin-top:-2px}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:56px;min-width:130px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;color:var(--text2);
  font-family:inherit;font-size:17px;font-weight:500;cursor:pointer;transition:all .18s;user-select:none}
.tab .ico{font-size:22px}
.tab:hover{background:var(--raised)}
.tab.on{color:var(--text);font-weight:700;background:var(--soft);border-color:var(--bord)}
.panel{display:none}
.panel.on{display:block}
.expbar{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 14px}
.expbar::-webkit-scrollbar{display:none}
.exp{flex:0 0 auto;min-height:50px;padding:8px 20px;border-radius:999px;background:var(--surface);
  border:1px solid var(--border);color:var(--text2);font-family:inherit;font-size:15.5px;font-weight:500;cursor:pointer;transition:all .15s}
.exp:hover{background:var(--raised)}
.exp.on{background:var(--soft);border-color:var(--bord);color:var(--accL);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 310px;gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.stage{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;height:500px;min-height:440px}
@media(max-width:820px){.stage{height:340px;min-height:280px}}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.hint{position:absolute;bottom:10px;inset-inline-start:12px;font-size:12.5px;color:rgba(255,255,255,.55);
  background:rgba(21,16,48,.6);backdrop-filter:blur(4px);padding:3px 10px;border-radius:8px;pointer-events:none;max-width:75%}
.readout{position:absolute;top:10px;inset-inline-start:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;max-width:85%}
.chip{font-size:12.5px;padding:3px 10px;border-radius:8px;background:rgba(21,16,48,.65);backdrop-filter:blur(4px);
  border:1px solid var(--border);color:var(--text2)}
.chip b{color:var(--text);font-weight:700}
.controls{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.controls h3{font-size:16px;font-weight:700;color:var(--text2);letter-spacing:.2px}
.notep{font-size:13.5px;color:var(--text2)}
.ctl label{display:flex;justify-content:space-between;font-size:15px;color:var(--text2);margin-bottom:5px}
.ctl label output{color:var(--text);font-weight:700;font-size:15px}
input[type=range]{width:100%;height:28px;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--raised)}
input[type=range]::-webkit-slider-thumb{appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-11px;border:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--raised)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--raised);color:var(--text);font-family:inherit;font-size:15.5px;font-weight:600;cursor:pointer;transition:filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.primary,.seg .btn.on{background:var(--brandOrange);border-color:#F7941D;color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{flex:1 0 calc(50% - 6px)}
.learn{margin-top:16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.learn .mark{font-size:20px;flex:none;margin-top:2px}
.learn h4{font-size:17px;font-weight:700;margin-bottom:4px}
.learn p{font-size:15.5px;color:var(--text2)}
.formula{display:inline-block;direction:ltr;font-family:Georgia,serif;font-style:italic;background:var(--raised);border-radius:6px;padding:0 8px;color:var(--text);font-size:14px}
footer{margin-top:28px;text-align:center;font-size:12.5px;color:rgba(255,255,255,.4)}


/* TV displays: stage fills ~58% of viewport height for big-screen impact */
@media(min-width:1400px){
  .stage{height:58vh;min-height:480px;max-height:720px}
  .grid{grid-template-columns:1fr 340px;gap:24px}
}
@media(min-width:1800px){
  .wrap{padding:32px 40px 60px}
  header h1{font-size:28px}
  header p{font-size:18px}
  .tab{min-height:62px;font-size:19px}
  .exp{min-height:54px;font-size:17px}
  .btn{min-height:58px;font-size:17px}
  .controls{padding:24px;gap:18px}
  .controls h3{font-size:18px}
  .ctl label,.ctl label output{font-size:17px}
  input[type=range]{height:36px}
  input[type=range]::-webkit-slider-thumb{width:32px;height:32px;margin-top:-13px}
  .learn h4{font-size:19px}
  .learn p{font-size:17px}
  .notep{font-size:16px}
  .grid{grid-template-columns:1fr 380px;gap:28px}
  .expbar{gap:10px;padding:4px 2px 18px}
}
/* ===== VuraVision TV scaling (65"/75"/86" touch displays) ===== */
@media(min-width:1500px){
  body{zoom:1.3}
  .wrap{max-width:1240px}
  .stage{height:520px}
}
@media(min-width:2200px){
  body{zoom:1.9}
  .wrap{max-width:1300px}
  .stage{height:560px}
}
@media(min-width:3300px){
  body{zoom:2.6}
  .wrap{max-width:1360px}
  .stage{height:580px}
}
@media(min-width:1500px){
  .exp{min-height:52px;font-size:15px;padding:8px 20px}
  .tab{min-height:56px}
  .btn{min-height:52px}
  input[type=range]{height:34px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-10px}
}
footer .fbrand{color:var(--brandOrange);font-weight:700;letter-spacing:2px;direction:ltr;display:inline-block}

:root{--bg:#13102c;--surface:#211b49;--raised:#332963;--brandOrange:#f8a529}
body{background:radial-gradient(ellipse at 90% 0,rgba(125,79,225,.22),transparent 45%),var(--bg)}
.stage{background:radial-gradient(circle at 30% 20%,#292250,#15122e);border-radius:24px;box-shadow:0 16px 44px #08051c55}
.controls,.learn{border-radius:22px;box-shadow:0 8px 28px #08051c22}.tab,.exp{transition:background .15s,border-color .15s}
.expbar{max-height:155px;overflow-y:auto;padding:8px;border-radius:16px;background:#ffffff05;margin-bottom:16px}
.vuraTools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}.vuraTools input{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);color:white;border-radius:14px;padding:12px;font:inherit}
.vuraTools button{background:#30265f;border:1px solid #685594;color:white;border-radius:14px;padding:10px 20px;font:inherit;cursor:pointer}
.vuraTools button.active{background:#f8a529;color:#20194f}.vuraCount{font-size:13px;color:#c5bddf;margin-bottom:10px}
button:focus-visible,input:focus-visible{outline:3px solid #f8a529;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
/* ============ core helpers ============ */
const $=s=>document.querySelector(s);
const faD="۰۱۲۳۴۵۶۷۸۹";
const fa=n=>String(n).replace(/[0-9]/g,d=>faD[+d]).replace(/\./g,"٫").replace(/-/g,"−");
const fa0=n=>fa(Math.round(n));
const fa1=n=>fa((+n).toFixed(1));
const fa2=n=>fa((+n).toFixed(2));
const DPR=Math.min(window.devicePixelRatio||1,2);
const TAU=Math.PI*2;
let GN=null;
function gauss(){if(GN!==null){const g=GN;GN=null;return g;}let u=0,v=0;while(!u)u=Math.random();v=Math.random();const m=Math.sqrt(-2*Math.log(u));GN=m*Math.sin(TAU*v);return m*Math.cos(TAU*v);}
function fitCanvas(cv){const r=cv.parentElement.getBoundingClientRect();const w=Math.round(r.width*DPR),h=Math.round(r.height*DPR);if(w>0&&(cv.width!==w||cv.height!==h)){cv.width=w;cv.height=h;}return{w:cv.width,h:cv.height};}
function project(p,v,w,h){const cy=Math.cos(v.yaw),sy=Math.sin(v.yaw),cx=Math.cos(v.pitch),sx=Math.sin(v.pitch);
  const x=p[0]*cy+p[2]*sy, z=-p[0]*sy+p[2]*cy, y=p[1];
  const y2=y*cx-z*sx, z2=y*sx+z*cx;
  const s=600/(600+z2)*v.zoom*DPR;
  return[w/2+x*s,h/2+y2*s,s,z2];}
function grid2(ctx,w,h,nx,ny){ctx.strokeStyle="rgba(255,255,255,.07)";ctx.lineWidth=1;
  for(let i=0;i<=nx;i++){ctx.beginPath();ctx.moveTo(i*w/nx,0);ctx.lineTo(i*w/nx,h);ctx.stroke();}
  for(let i=0;i<=ny;i++){ctx.beginPath();ctx.moveTo(0,i*h/ny);ctx.lineTo(w,i*h/ny);ctx.stroke();}}
function ball(ctx,x,y,R,color){const g=ctx.createRadialGradient(x-R*.35,y-R*.4,R*.12,x,y,R);
  g.addColorStop(0,"#fff");g.addColorStop(.3,color);g.addColorStop(1,"rgba(10,10,10,.9)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.fill();}
/* ============ registry & UI framework ============ */
const SUBJECTS={
  physics:{label:"فیزیک",ico:"🪐",acc:"#5E9FE8",accL:"#9cc4f2",soft:"rgba(94,159,232,.18)",bord:"rgba(94,159,232,.45)"},
  chem:{label:"شیمی",ico:"⚗️",acc:"#72BC8F",accL:"#a4d6b9",soft:"rgba(114,188,143,.18)",bord:"rgba(114,188,143,.45)"},
  math:{label:"ریاضی",ico:"🌊",acc:"#BF8EDA",accL:"#d9b8ea",soft:"rgba(191,142,218,.18)",bord:"rgba(191,142,218,.45)"},
  stats:{label:"آمار",ico:"🎲",acc:"#DE9255",accL:"#ecba93",soft:"rgba(222,146,85,.18)",bord:"rgba(222,146,85,.45)"}
};
const REG={physics:[],chem:[],math:[],stats:[]};
const CUR={subj:"physics",exp:{}};
const CVS={},CTX={};
function defExp(subj,e){REG[subj].push(e);}
function buildControls(subj,ex){
  const box=$("#ct-"+subj);box.innerHTML="";
  const H=document.createElement("h3");H.textContent=ex.ctlTitle||"تنظیمات آزمایش";box.appendChild(H);
  for(const c of ex.controls||[]){
    if(c.type==="range"){
      ex.p[c.id]=c.value;
      const d=document.createElement("div");d.className="ctl";
      d.innerHTML=`<label>${c.label} <output></output></label><input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}" aria-label="${c.label}">`;
      const inp=d.querySelector("input"),out=d.querySelector("output");
      out.textContent=c.fmt(c.value);
      inp.addEventListener("input",()=>{ex.p[c.id]=+inp.value;out.textContent=c.fmt(+inp.value);ex.change&&ex.change(ex,c.id);});
      box.appendChild(d);
    }else if(c.type==="buttons"){
      const d=document.createElement("div");d.className="btnrow";
      for(const b of c.items){
        const el=document.createElement("button");el.className="btn"+(b.primary?" primary":"");el.textContent=b.label;
        el.addEventListener("click",()=>ex.btn&&ex.btn(ex,b.id));d.appendChild(el);
      }
      box.appendChild(d);
    }else if(c.type==="toggle"){
      ex.p[c.id]=c.value;
      const el=document.createElement("button");el.className="btn"+(c.value?" primary":"");
      const paint=()=>{el.textContent=c.label+": "+(ex.p[c.id]?(c.onText||"روشن"):(c.offText||"خاموش"));el.classList.toggle("primary",!!ex.p[c.id]);};
      paint();
      el.addEventListener("click",()=>{ex.p[c.id]=!ex.p[c.id];paint();ex.change&&ex.change(ex,c.id);});
      box.appendChild(el);
    }else if(c.type==="choices"){
      ex.p[c.id]=c.value;
      const d=document.createElement("div");d.className="seg";
      for(const it of c.items){
        const el=document.createElement("button");el.className="btn"+(it.val===c.value?" on":"");el.textContent=it.label;
        el.addEventListener("click",()=>{ex.p[c.id]=it.val;[...d.children].forEach(x=>x.classList.toggle("on",x===el));ex.change&&ex.change(ex,c.id);});
        d.appendChild(el);
      }
      box.appendChild(d);
    }else if(c.type==="note"){
      const p=document.createElement("p");p.className="notep";p.textContent=c.text;box.appendChild(p);
    }
  }
}
function buildReadouts(subj,ex){
  const r=$("#ro-"+subj);r.innerHTML="";
  for(const c of ex.readouts||[]){
    const s=document.createElement("span");s.className="chip";
    s.innerHTML=`${c.label}: <b id="r-${subj}-${c.id}">–</b>`;r.appendChild(s);
  }
}
function setR(subj,id,val){const el=document.getElementById(`r-${subj}-${id}`);if(el&&el.textContent!==val)el.textContent=val;}
function selectExp(subj,id,updateHash){
  const ex=REG[subj].find(e=>e.id===id)||REG[subj][0];
  CUR.exp[subj]=ex;ex.p={};ex.s={};ex.view={yaw:.5,pitch:.38,zoom:1,touched:false};
  buildControls(subj,ex);buildReadouts(subj,ex);
  $("#lt-"+subj).textContent=ex.learnTitle||"";$("#lb-"+subj).innerHTML=ex.learnBody||"";
  const hint=$("#hint-"+subj);hint.textContent=ex.hint||"";hint.style.display=ex.hint?"":"none";
  const bar=$("#exps-"+subj);[...bar.children].forEach(b=>b.classList.toggle("on",b.dataset.id===ex.id));
  ex.init&&ex.init(ex);
  if(updateHash!==false)history.replaceState(null,"","#"+subj+"/"+ex.id);
}
function setTab(name,updateHash){
  CUR.subj=name;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="panel-"+name));
  if(updateHash!==false){const ex=CUR.exp[name];history.replaceState(null,"","#"+name+(ex?"/"+ex.id:""));}
}
function attachPointer(subj){
  const cv=CVS[subj];const ptrs=new Map();let lastD=0;
  const xy=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*DPR,(e.clientY-r.top)*DPR];};
  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    const ex=CUR.exp[subj];const[x,y]=xy(e);ex.drag&&ex.drag(ex,"down",x,y,cv);});
  cv.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId))return;
    const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    const ex=CUR.exp[subj];const dx=e.clientX-prev[0],dy=e.clientY-prev[1];
    if(ptrs.size===1){
      if(ex.use3D){ex.view.yaw+=dx*.006;ex.view.pitch=Math.max(-1.4,Math.min(1.4,ex.view.pitch+dy*.006));ex.view.touched=true;}
      const[x,y]=xy(e);ex.drag&&ex.drag(ex,"move",x,y,cv,dx*DPR,dy*DPR);
    }else if(ptrs.size===2&&ex.use3D){
      const p=[...ptrs.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
      if(lastD)ex.view.zoom=Math.max(.4,Math.min(3,ex.view.zoom*d/lastD));lastD=d;
    }});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)lastD=0;const ex=CUR.exp[subj];ex.drag&&ex.drag(ex,"up",0,0,cv);};
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",e=>{const ex=CUR.exp[subj];if(ex&&ex.use3D){e.preventDefault();ex.view.zoom=Math.max(.4,Math.min(3,ex.view.zoom*(e.deltaY<0?1.08:.92)));}},{passive:false});
}
/* ============ PHYSICS ============ */
defExp("physics",{
 id:"orbit",icon:"\u{1FA90}",title:"گرانش و مدار",use3D:true,
 hint:"با انگشت یا ماوس بچرخانید · با دو انگشت یا اسکرول زوم کنید",
 readouts:[{id:"n",label:"سیاره‌ها"},{id:"v",label:"سریع‌ترین"}],
 controls:[
  {type:"range",id:"G",label:"شدت گرانش (G)",min:.2,max:2.5,step:.05,value:1,fmt:v=>fa1(v)+"×"},
  {type:"range",id:"speed",label:"سرعت زمان",min:.2,max:3,step:.1,value:1,fmt:v=>fa1(v)+"×"},
  {type:"buttons",items:[{id:"add",label:"+ سیارهٔ جدید",primary:true},{id:"reset",label:"بازنشانی"}]}
 ],
 learnTitle:"قانون گرانش جهانی نیوتن",
 learnBody:'هر دو جرم یکدیگر را با نیروی <span class="formula">F = G·M·m / r²</span> جذب می‌کنند. گرانش را زیاد کنید تا مدارها تنگ‌تر شوند؛ کم کنید تا سیاره‌ها فرار کنند! سیاره‌های نزدیک‌تر سریع‌تر می‌چرخند — همان قانون سوم کپلر.',
 init(ex){
  const s=ex.s;
  s.SM=2600;s.ci=0;
  s.colors=["#5E9FE8","#DE9255","#72BC8F","#BF8EDA","#E97366","#EAC26B","#9cc4f2","#a4d6b9"];
  s.stars=[...Array(90)].map(()=>{const r=900+Math.random()*900,a=Math.random()*TAU,b=(Math.random()-.5)*Math.PI;
    return[r*Math.cos(a)*Math.cos(b),r*Math.sin(b),r*Math.sin(a)*Math.cos(b)];});
  s.add=(r)=>{
    if(s.bodies.length>=8)return;
    const tilt=(Math.random()-.5)*.5,ph=Math.random()*TAU;
    const v=Math.sqrt(ex.p.G*s.SM/r);
    s.bodies.push({
      pos:[r*Math.cos(ph),r*Math.sin(ph)*Math.sin(tilt),r*Math.sin(ph)*Math.cos(tilt)],
      vel:[-v*Math.sin(ph),v*Math.cos(ph)*Math.sin(tilt),v*Math.cos(ph)*Math.cos(tilt)],
      color:s.colors[s.ci++%s.colors.length],size:5+Math.random()*4,trail:[]});
  };
  s.step=(hh)=>{
    for(const b of s.bodies){
      const r=Math.hypot(b.pos[0],b.pos[1],b.pos[2]);
      const a=-ex.p.G*s.SM/(r*r*r);
      for(let i=0;i<3;i++)b.vel[i]+=a*b.pos[i]*hh;
      for(let i=0;i<3;i++)b.pos[i]+=b.vel[i]*hh;
    }
    s.bodies=s.bodies.filter(b=>Math.hypot(b.pos[0],b.pos[1],b.pos[2])<2200);
  };
  s.reset=()=>{s.bodies=[];s.ci=0;[110,170,240].forEach(r=>s.add(r));
    for(let i=0;i<400;i++)s.step(.12);s.bodies.forEach(b=>b.trail=[]);};
  s.reset();
 },
 btn(ex,id){if(id==="add")ex.s.add(90+Math.random()*220);else ex.s.reset();},
 frame(ex,ctx,w,h,dt){
  const s=ex.s,v=ex.view;
  const steps=Math.max(1,Math.round(2*ex.p.speed));
  for(let i=0;i<steps;i++)s.step(.12);
  s.tick=(s.tick||0)+1;
  if(s.tick%2===0)for(const b of s.bodies){b.trail.push([...b.pos]);if(b.trail.length>90)b.trail.shift();}
  for(const st of s.stars){const pr=project(st,v,w,h);ctx.fillStyle=pr[3]>0?"rgba(255,255,255,.12)":"rgba(255,255,255,.3)";ctx.fillRect(pr[0],pr[1],1.6*DPR,1.6*DPR);}
  const c0=project([0,0,0],v,w,h),sx=c0[0],sy=c0[1],R=16*c0[2];
  const g=ctx.createRadialGradient(sx,sy,R*.2,sx,sy,R*3);
  g.addColorStop(0,"rgba(234,194,107,.9)");g.addColorStop(.4,"rgba(234,194,107,.25)");g.addColorStop(1,"rgba(234,194,107,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,R*3,0,TAU);ctx.fill();
  ball(ctx,sx,sy,R,"#EAC26B");
  for(const b of s.bodies){
    ctx.strokeStyle=b.color+"66";ctx.lineWidth=1.4*DPR;ctx.beginPath();
    b.trail.forEach((p,i)=>{const pr=project(p,v,w,h);i?ctx.lineTo(pr[0],pr[1]):ctx.moveTo(pr[0],pr[1]);});ctx.stroke();
  }
  [...s.bodies].sort((a,b)=>project(b.pos,v,w,h)[3]-project(a.pos,v,w,h)[3])
   .forEach(b=>{const pr=project(b.pos,v,w,h);ball(ctx,pr[0],pr[1],b.size*pr[2],b.color);});
  let vmax=0;for(const b of s.bodies)vmax=Math.max(vmax,Math.hypot(b.vel[0],b.vel[1],b.vel[2]));
  setR("physics","n",fa0(s.bodies.length));
  setR("physics","v",s.bodies.length?fa1(vmax):"–");
 }
});

 learnTitle:"حرکت پرتابه‌ای",
 learnBody:'بُرد پرتابه <span class="formula">R = v² sin(2θ) / g</span> است. چرا زاویهٔ ۴۵ درجه دورترین پرتاب را می‌دهد؟ چون sin(۲×۴۵°)=۱ بیشینه است. زاویه‌های ۳۰ و ۶۰ درجه بُرد یکسانی دارند — امتحان کنید!',
 init(ex){ex.s={balls:[],ci:0,colors:["#5E9FE8","#DE9255","#72BC8F","#BF8EDA","#E97366"]};},
 btn(ex,id){
  const s=ex.s;
  if(id==="clear"){s.balls=[];return;}
  const a=ex.p.ang*Math.PI/180;
  s.balls.push({x:0,y:0,vx:ex.p.v0*Math.cos(a),vy:ex.p.v0*Math.sin(a),done:false,trail:[],color:s.colors[s.ci++%5]});
  if(s.balls.length>6)s.balls.shift();
 },
 frame(ex,ctx,w,h,dt){
  const s=ex.s,p=ex.p;
  const a=p.ang*Math.PI/180;
  const R=p.v0*p.v0*Math.sin(2*a)/p.g, H=Math.pow(p.v0*Math.sin(a),2)/(2*p.g);
  let maxR=R;for(const b of s.balls)maxR=Math.max(maxR,b.x);
  const ox=34*DPR,oy=h-40*DPR;
  const sc=Math.min((w-70*DPR)/Math.max(60,maxR*1.08),(h-90*DPR)/Math.max(30,H*1.25));

   if(b.done)continue;
   b.trail.push([b.x,b.y]);if(b.trail.length>400)b.trail.shift();
   b.vy-=p.g*hh;b.x+=b.vx*hh;b.y+=b.vy*hh;
   if(b.y<0){b.y=0;b.done=true;}
  }
  ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=2*DPR;
  ctx.beginPath();ctx.moveTo(0,oy+1);ctx.lineTo(w,oy+1);ctx.stroke();
  ctx.setLineDash([3,7]);ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=1.2*DPR;ctx.beginPath();
  for(let i=0;i<=60;i++){const X=R*i/60,Y=X*Math.tan(a)-p.g*X*X/(2*p.v0*p.v0*Math.cos(a)*Math.cos(a));
   const qx=ox+X*sc,qy=oy-Y*sc;i?ctx.lineTo(qx,qy):ctx.moveTo(qx,qy);}
  ctx.stroke();ctx.setLineDash([]);
  ctx.save();ctx.translate(ox,oy);ctx.rotate(-a);
  ctx.fillStyle="#4a4a48";ctx.fillRect(0,-5*DPR,30*DPR,10*DPR);ctx.restore();
  ctx.fillStyle="#5a5a58";ctx.beginPath();ctx.arc(ox,oy,9*DPR,0,TAU);ctx.fill();

 }
});

  ctx.setLineDash([3,6]);ctx.strokeStyle="rgba(255,255,255,.18)";ctx.lineWidth=1.2*DPR;
  for(const sgn of[1,-1]){ctx.beginPath();for(let i=0;i<=120;i++){const x=L*i/120;
   const y=cy-sgn*A*env(x);i?ctx.lineTo(pad+x,y):ctx.moveTo(pad+x,y);}ctx.stroke();}
  ctx.setLineDash([]);
  ctx.strokeStyle="#5E9FE8";ctx.lineWidth=3*DPR;ctx.beginPath();
  for(let i=0;i<=160;i++){const x=L*i/160;const y=cy-A*env(x)*Math.cos(s.t*p.n);
   i?ctx.lineTo(pad+x,y):ctx.moveTo(pad+x,y);}
  ctx.stroke();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(pad,cy,5*DPR,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(pad+L,cy,5*DPR,0,TAU);ctx.fill();
  ctx.strokeStyle="#E97366";ctx.lineWidth=2*DPR;
  for(let k=1;k<p.n;k++){const x=pad+L*k/p.n;ctx.beginPath();ctx.arc(x,cy,6*DPR,0,TAU);ctx.stroke();}

 learnBody:'<span class="formula">PV = NkT</span> — فشار حاصل برخورد میلیاردها ذره با دیواره است. مقادیر در واحدهای نسبی با k=1 نمایش داده می‌شوند؛ PV÷NT برابر یک است. فشار از قانون محاسبه می‌شود و حرکت ذره‌ها نمایشی است، نه اندازه‌گیری فشار از برخوردها.',
 init(ex){
  const s=ex.s;s.parts=[];s.Psm=0;
  s.make=n=>{while(s.parts.length<n){const a=Math.random()*TAU;
    s.parts.push({x:Math.random(),y:Math.random(),vx:Math.cos(a),vy:Math.sin(a)});}
   if(s.parts.length>n)s.parts.length=n;};
  s.make(60);
 },
 frame(ex,ctx,w,h,dt){
  const s=ex.s,p=ex.p;s.make(p.N);
  const pad=16*DPR,bx=pad,by=pad,bw=(w-2*pad-30*DPR)*p.V,bh=h-2*pad;
  const sp=Math.sqrt(p.T)*.45,hh=Math.min(dt,.033);
  let imp=0;
  for(const q of s.parts){
   q.x+=q.vx*sp*hh;q.y+=q.vy*sp*hh;
   if(q.x<0){q.x=0;q.vx=Math.abs(q.vx);imp+=Math.abs(q.vx);}
   if(q.x>1){q.x=1;q.vx=-Math.abs(q.vx);imp+=Math.abs(q.vx);}
   if(q.y<0){q.y=0;q.vy=Math.abs(q.vy);imp+=Math.abs(q.vy);}
   if(q.y>1){q.y=1;q.vy=-Math.abs(q.vy);imp+=Math.abs(q.vy);}
  }
  const P=p.N*p.T/p.V;
  s.Psm+=(P-s.Psm)*.04;
  ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=2*DPR;
  ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle="#4a4a48";ctx.fillRect(bx+bw,by,5*DPR,bh);
  ctx.fillStyle="#5a5a58";ctx.fillRect(bx+bw+5*DPR,by+bh/2-24*DPR,14*DPR,48*DPR);

  for(const q of s.parts){ctx.beginPath();ctx.arc(bx+q.x*bw,by+q.y*bh,3.2*DPR,0,TAU);ctx.fill();}
  setR("physics","P",fa1(P));
  setR("physics","c",fa2(P*p.V/(p.N*p.T)));
 }
});

 init(ex){
  const s=ex.s;s.N=64;s.parts=[];
  for(let i=0;i<s.N;i++){const a=Math.random()*TAU;
   s.parts.push({x:Math.random(),y:Math.random(),vx:Math.cos(a),vy:Math.sin(a),gx:(i%8),gy:Math.floor(i/8)});}
 },
 frame(ex,ctx,w,h,dt){
  const s=ex.s,T=ex.p.T;
  const pad=16*DPR,bw=w-2*pad,bh=h-2*pad;
  const hh=Math.min(dt,.033);
  const state=T<0?"solid":T<100?"liquid":"gas";
  for(const q of s.parts){
   if(state==="solid"){
    const jig=(T+40)/40*.006;
    const tx=.5+(q.gx-3.5)*.075,ty=.62+(q.gy-3.5)*.075;
    q.x+=(tx-q.x)*.12+(Math.random()-.5)*jig;
    q.y+=(ty-q.y)*.12+(Math.random()-.5)*jig;
   }else if(state==="liquid"){
    const sp=.12+T/100*.25;
    q.vx+=(Math.random()-.5)*.6;q.vy+=(Math.random()-.5)*.6+.25;
    const m=Math.hypot(q.vx,q.vy)||1;q.vx/=m;q.vy/=m;
    q.x+=q.vx*sp*hh;q.y+=q.vy*sp*hh;
    if(q.y<.45){q.y=.45;q.vy=Math.abs(q.vy);}
    if(q.x<0){q.x=0;q.vx=Math.abs(q.vx);}
    if(q.x>1){q.x=1;q.vx=-Math.abs(q.vx);}
    if(q.y>1){q.y=1;q.vy=-Math.abs(q.vy);}
   }else{
    const sp=.3+(T-100)/40*.4;
    q.x+=q.vx*sp*hh;q.y+=q.vy*sp*hh;
    if(q.x<0){q.x=0;q.vx=Math.abs(q.vx);}
    if(q.x>1){q.x=1;q.vx=-Math.abs(q.vx);}
    if(q.y<0){q.y=0;q.vy=Math.abs(q.vy);}
    if(q.y>1){q.y=1;q.vy=-Math.abs(q.vy);}
   }
  }
  ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=2*DPR;ctx.strokeRect(pad,pad,bw,bh);
  if(state==="liquid"){ctx.fillStyle="rgba(94,159,232,.08)";ctx.fillRect(pad,pad+bh*.45,bw,bh*.55);}
  const col=state==="solid"?"#9cc4f2":state==="liquid"?"#5E9FE8":"#E97366";
  for(const q of s.parts)ball(ctx,pad+q.x*bw,pad+q.y*bh,6.5*DPR,col);
  setR("chem","st",state==="solid"?"جامد ❄️":state==="liquid"?"مایع 💧":"گاز ☁️");
  setR("chem","T",fa0(T)+"°C");
 }
});

 ],
 learnTitle:"فیبوناچی و عدد طلایی",
 learnBody:'در دنبالهٔ فیبوناچی هر عدد جمع دو عدد قبلی است: ۱، ۱، ۲، ۳، ۵، ۸، ۱۳،... نسبت دو جملهٔ متوالی به عدد طلایی <span class="formula">φ ≈ 1.618</span> میل می‌کند — همان نسبتی که در صدف حلزون و آرایش دانه‌های آفتابگردان دیده می‌شود.',
 frame(ex,ctx,w,h){
  const n=ex.p.n;
  const fib=[1,1];for(let i=2;i<n;i++)fib.push(fib[i-1]+fib[i-2]);
  const dirs=[[1,0],[0,-1],[-1,0],[0,1]];
  const sq=[];let x=0,y=0,minX=0,minY=0,maxX=1,maxY=1;
  sq.push({x:0,y:0,s:1,d:0});
  let cx2=1,cy2=1;
  for(let i=1;i<n;i++){
   const s2=fib[i],d=i%4;
   let nx,ny;
   if(d===0){nx=maxX;ny=maxY-s2;}
   else if(d===1){nx=maxX-s2;ny=minY-s2;}
   else if(d===2){nx=minX-s2;ny=minY;}
   else{nx=minX;ny=maxY;}
   sq.push({x:nx,y:ny,s:s2,d});
   minX=Math.min(minX,nx);minY=Math.min(minY,ny);
   maxX=Math.max(maxX,nx+s2);maxY=Math.max(maxY,ny+s2);

   ctx.strokeStyle="rgba(191,142,218,.5)";ctx.lineWidth=1.4*DPR;

   ctx.fillRect(ox+q.x*sc,oy+q.y*sc,q.s*sc,q.s*sc);

   else if(q.d===2){ccx=q.x+q.s;ccy=q.y;a0=Math.PI/2;}
   else{ccx=q.x;ccy=q.y;a0=0;}
   ctx.beginPath();ctx.arc(ox+ccx*sc,oy+ccy*sc,r,a0,a0+Math.PI/2);ctx.stroke();

 }

 learnBody:'فوریه نشان داد هر سیگنال دوره‌ای — حتی موج مربعی تیز — جمع سینوس‌هاست: <span class="formula">y = Σ (4/π)(1/k)·sin(kx)</span> برای k فرد. جمله‌ها را زیاد کنید تا تقریب بهتر شود. فشرده‌سازی صدا و تصویر (MP3، JPEG) بر همین ایده استوار است.',
 init(ex){ex.s={t:0};},
 frame(ex,ctx,w,h,dt){
  const s=ex.s,p=ex.p;s.t+=dt*p.sp*2;
  grid2(ctx,w,h,12,6);
  const cy=h/2,amp=h*.3;
  ctx.setLineDash([4,6]);ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1.6*DPR;
  ctx.beginPath();
  for(let i=0;i<=240;i++){
   const u=(i/240*TAU*2-s.t)%TAU;
   const sqv=((u+TAU)%TAU)<Math.PI?1:-1;
   const x=w*i/240,y=cy-sqv*amp*.785;
   i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();ctx.setLineDash([]);
  let err=0;
  ctx.strokeStyle="#BF8EDA";ctx.lineWidth=3*DPR;ctx.beginPath();
  for(let i=0;i<=300;i++){
   const u=i/300*TAU*2-s.t;
   let Y=0;
   for(let k2=0;k2<p.N;k2++){const k=2*k2+1;Y+=Math.sin(k*u)/k;}
   const sqv=(((u%TAU)+TAU)%TAU)<Math.PI?1:-1;
   err+=Math.pow(Y-sqv*Math.PI/4,2);
   const x=w*i/300,y=cy-Y*amp;
   i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();
  setR("math","n",fa0(p.N));
  setR("math","e",fa0(Math.sqrt(err/300)/(Math.PI/4)*100)+"٪");
 }
});

defExp("stats",{

 init(ex){
  const s=ex.s;s.ROWS=10;s.BINS=11;s.bins=Array(11).fill(0);s.balls=[];s.total=0;
  s.drop=(n,anim)=>{
   for(let i=0;i<n;i++){
    if(anim&&s.balls.length<40){s.balls.push({r:0,f:0,off:0,poff:0,t:-(s.balls.length*.3+Math.random()*.15)});}
    else{let x=0;for(let k=0;k<s.ROWS;k++)x+=Math.random()<.5?0:1;s.bins[x]++;s.total++;}
   }};
  s.drop(240,false);s.drop(6,true);
 },
 btn(ex,id){
  const s=ex.s;
  if(id==="reset"){s.bins=Array(11).fill(0);s.balls=[];s.total=0;}
  else if(id==="d10")s.drop(10,true);
  else s.drop(200,false);
 },
 frame(ex,ctx,w,h,dt){
  const s=ex.s;
  const top=h*.1,dy=(h*.42)/s.ROWS,cx=w/2,dx=Math.min(w*.075,34*DPR)/2;
  ctx.fillStyle="rgba(255,255,255,.35)";
  for(let r=0;r<s.ROWS;r++)for(let k2=0;k2<=r;k2++){
   const X=cx+(k2-r/2)*dx*2,Y=top+r*dy;
   ctx.beginPath();ctx.arc(X,Y,2.2*DPR,0,TAU);ctx.fill();
  }
  for(const b of s.balls){
   b.t+=dt*5;
   while(b.t>1){b.t-=1;b.poff=b.off;
    if(b.r<s.ROWS){b.f+=Math.random()<.5?0:1;b.r++;b.off=b.f-b.r/2;}
    else{s.bins[b.f]++;s.total++;b.dead=true;break;}
   }
   if(b.dead)continue;
   const tt=Math.max(0,b.t);
   const X=cx+(b.poff+(b.off-b.poff)*tt)*dx*2,Y=top+(b.r-1+tt)*dy;
   ball(ctx,X,Math.max(top-dy*.7,Y),4.5*DPR,"#EAC26B");
  }
  s.balls=s.balls.filter(b=>!b.dead);
  const bw=Math.min(w*.075,34*DPR),by=h-24*DPR,bhMax=h*.34;
  const mx=Math.max(...s.bins,1);
  for(let i=0;i<s.BINS;i++){
   const X=cx+(i-5)*bw;
   const bh2=s.bins[i]/mx*bhMax;
   ctx.fillStyle="#DE9255";
   ctx.beginPath();ctx.roundRect(X-bw/2+2*DPR,by-bh2,bw-4*DPR,bh2,3*DPR);ctx.fill();
  }
  ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=1.4*DPR;
  ctx.beginPath();ctx.moveTo(cx-5.5*bw,by+1);ctx.lineTo(cx+5.5*bw,by+1);ctx.stroke();
  if(ex.p.curve&&s.total>0){
   const lg=z=>{const c2=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.001208650973866179,-.000005395239384953];
    let x2=z,y2=z,tmp=x2+5.5;tmp-=(x2+.5)*Math.log(tmp);let ser=1.000000000190015;
    for(let j=0;j<6;j++)ser+=c2[j]/++y2;return-tmp+Math.log(2.5066282746310005*ser/x2);};
   const binom=k2=>Math.exp(lg(11)-lg(k2+1)-lg(11-k2)+10*Math.log(.5));
   const pk=binom(5);
   ctx.setLineDash([5,5]);ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=2*DPR;ctx.beginPath();
   for(let i=0;i<=100;i++){
    const kk=i/100*10;
    const X=cx+(kk-5)*bw;
    const pv=Math.exp(-Math.pow(kk-5,2)/(2*2.5))/Math.sqrt(TAU*2.5);
    const Ys=by-(s.total*pv*(binom(5)*Math.sqrt(TAU*2.5))/mx)*bhMax;
    i?ctx.lineTo(X,Ys):ctx.moveTo(X,Ys);
   }
   ctx.stroke();ctx.setLineDash([]);
  }
  let n=0,sum=0,sq=0;
  s.bins.forEach((c2,i)=>{n+=c2;sum+=c2*i;sq+=c2*i*i;});
  const mean=n?sum/n:0,sd=n?Math.sqrt(Math.max(0,sq/n-mean*mean)):0;
  setR("stats","n",fa0(n));
  setR("stats","mean",n?fa2(mean):"–");
  setR("stats","sd",n?fa2(sd):"–");
 }
});

defExp("stats",{
 id:"walk",icon:"🚶",title:"قدم زدن تصادفی",
 readouts:[{id:"t",label:"گام‌ها"},{id:"sd",label:"پراکندگی"}],
 controls:[
  {type:"range",id:"n",label:"تعداد مسیرها",min:5,max:60,step:5,value:25,fmt:v=>fa0(v)},
  {type:"buttons",items:[{id:"reset",label:"دوباره",primary:true}]}
 ],
 learnTitle:"پخش و حرکت براونی",
 learnBody:'هر مسیر در هر گام شانسی بالا یا پایین می‌رود. میانگین جابه‌جایی صفر است اما پراکندگی با <span class="formula">√t</span> رشد می‌کند (خط چین‌ها). انتشار بو در هوا، حرکت مولکول‌ها و حتی نوسان قیمت سهام چنین رفتاری دارند.',
 init(ex){
  const s=ex.s;
  s.reset=()=>{s.walks=[...Array(60)].map(()=>[0]);s.t=0;};
  s.reset();
 },
 btn(ex){ex.s.reset();},
 change(ex,id){if(id==="n")ex.s.reset();},
 frame(ex,ctx,w,h,dt){
  const s=ex.s,N=ex.p.n;
  const steps=560;
  if(s.t<steps){
   for(let k2=0;k2<3;k2++){
    if(s.t>=steps)break;
    s.t++;
    for(let i=0;i<N;i++){const wlk=s.walks[i];wlk.push(wlk[wlk.length-1]+(Math.random()<.5?-1:1));}
   }
  }
  const px2=16*DPR,pw=w-2*px2,cy=h/2,vs=h/2/(2.6*Math.sqrt(steps));
  ctx.strokeStyle="rgba(255,255,255,.2)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(px2,cy);ctx.lineTo(px2+pw,cy);ctx.stroke();
  ctx.setLineDash([4,6]);ctx.strokeStyle="rgba(255,255,255,.4)";ctx.lineWidth=1.4*DPR;
  for(const sgn of[1,-1]){
   ctx.beginPath();
   for(let i2=0;i2<=100;i2++){
    const tt=steps*i2/100;
    const X=px2+pw*tt/steps,Y=cy-sgn*Math.sqrt(tt)*vs;
    i2?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
   }
   ctx.stroke();
  }
  ctx.setLineDash([]);
  const cols=["#5E9FE8","#DE9255","#72BC8F","#BF8EDA","#E97366","#EAC26B"];
  for(let i=0;i<N;i++){
   const wlk=s.walks[i];
   ctx.strokeStyle=cols[i%6]+"99";ctx.lineWidth=1.3*DPR;ctx.beginPath();
   const step=Math.max(1,Math.floor(wlk.length/300));
   for(let j=0;j<wlk.length;j+=step){
    const X=px2+pw*j/steps,Y=cy-wlk[j]*vs;
    j?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
   }
   ctx.stroke();
  }
  let sq=0;for(let i=0;i<N;i++){const wlk=s.walks[i];sq+=Math.pow(wlk[wlk.length-1],2);}
  setR("stats","t",fa0(s.t));
  setR("stats","sd",fa1(Math.sqrt(sq/N)));
 }
});
defExp("stats",{
 id:"clt",icon:"📊",title:"میانگین نمونه‌ها",
 readouts:[{id:"n",label:"نمونه‌ها"},{id:"m",label:"میانگین"},{id:"sd",label:"انحراف"}],
 controls:[
  {type:"range",id:"k",label:"اندازهٔ هر نمونه (تعداد تاس)",min:1,max:30,step:1,value:5,fmt:v=>fa0(v)},
  {type:"buttons",items:[{id:"s200",label:"+ ۲۰۰ نمونه",primary:true},{id:"reset",label:"بازنشانی"}]},
  {type:"note",text:"هر نمونه = میانگین k تاس. با k بزرگ‌تر، توزیع باریک‌تر و زنگوله‌ای‌تر می‌شود."}
 ],
 learnTitle:"قدرت میانگین‌گیری",
 learnBody:'یک تاس توزیع تخت دارد، اما میانگین چند تاس زنگوله‌ای می‌شود و پراکندگی‌اش با <span class="formula">σ/√k</span> کوچک می‌شود. برای همین نظرسنجی با نمونهٔ بزرگ‌تر دقیق‌تر است.',
 init(ex){ex.s={means:[]};},
 btn(ex,id){
  const s=ex.s;
  if(id==="reset"){s.means=[];return;}
  for(let i=0;i<200;i++){
   let sum=0;for(let j=0;j<ex.p.k;j++)sum+=1+Math.floor(Math.random()*6);
   s.means.push(sum/ex.p.k);
  }
 },
 change(ex,id){if(id==="k")ex.s.means=[];},
 frame(ex,ctx,w,h){
  const s=ex.s;
  const B=40;
  const bins=Array(B).fill(0);
  for(const m of s.means){const bi=Math.min(B-1,Math.floor((m-1)/5*B));bins[bi]++;}
  const mxc=Math.max(...bins,1);
  const px2=24*DPR,pw=w-2*px2,by=h-32*DPR,bhMax=h*.68;
  ctx.font=(11*DPR)+"px Vazirmatn,Tahoma";ctx.textAlign="center";
  for(let i=0;i<B;i++){
   const bh2=bins[i]/mxc*bhMax;
   ctx.fillStyle="#DE9255";
   ctx.fillRect(px2+i*pw/B+1,by-bh2,pw/B-2,bh2);
  }
  ctx.fillStyle="rgba(255,255,255,.6)";
  for(let v=1;v<=6;v++)ctx.fillText(fa0(v),px2+(v-1)/5*pw,by+16*DPR);
  ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=1.4*DPR;
  ctx.beginPath();ctx.moveTo(px2,by+1);ctx.lineTo(px2+pw,by+1);ctx.stroke();
  if(s.means.length>2){
   const n=s.means.length;
   const mean=s.means.reduce((a,b)=>a+b,0)/n;
   const sd=Math.sqrt(s.means.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n);
   if(sd>0){
    ctx.setLineDash([5,5]);ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=2*DPR;ctx.beginPath();
    const pk=n*(5/B)/(sd*Math.sqrt(TAU));
    for(let i=0;i<=120;i++){
     const v=1+5*i/120;
     const pv=n*(5/B)*Math.exp(-Math.pow(v-mean,2)/(2*sd*sd))/(sd*Math.sqrt(TAU));
     const X=px2+(v-1)/5*pw,Y=by-pv/mxc*bhMax;
     i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
    }
    ctx.stroke();ctx.setLineDash([]);
   }
   setR("stats","m",fa2(mean));setR("stats","sd",fa2(sd));
  }else{setR("stats","m","–");setR("stats","sd","–");}
  setR("stats","n",fa0(s.means.length));
 }
});
defExp("stats",{
 id:"regression",icon:"📉",title:"همبستگی و رگرسیون",
 readouts:[{id:"r",label:"r نمونه"},{id:"m",label:"شیب خط"}],
 controls:[
  {type:"range",id:"r",label:"همبستگی هدف (r)",min:-1,max:1,step:.05,value:.7,fmt:v=>fa2(v)},
  {type:"buttons",items:[{id:"new",label:"نمونهٔ جدید",primary:true}]}
 ],
 learnTitle:"رابطهٔ دو متغیر",
 learnBody:'ضریب همبستگی r بین ۱− تا ۱+ قدرت رابطهٔ خطی را نشان می‌دهد و خط رگرسیون بهترین پیش‌بینی خطی است. اما یادتان باشد: همبستگی به معنای علیت نیست!',
 init(ex){
  const s=ex.s;
  s.gen=()=>{
   const r=ex.p.r;s.pts=[];
   for(let i=0;i<60;i++){
    const x=gauss(),e=gauss();
    s.pts.push([x,r*x+Math.sqrt(Math.max(0,1-r*r))*e]);
   }};
  s.gen();
 },
 btn(ex){ex.s.gen();},
 change(ex,id){if(id==="r")ex.s.gen();},
 frame(ex,ctx,w,h){
  const s=ex.s;
  const R2=3.2;
  const sx=v=>(v+R2)/(2*R2)*w, sy=v=>h-(v+R2)/(2*R2)*h;
  grid2(ctx,w,h,8,8);
  const n=s.pts.length;
  let mx=0,my=0;for(const[x,y]of s.pts){mx+=x;my+=y;}mx/=n;my/=n;
  let sxy=0,sxx=0,syy=0;
  for(const[x,y]of s.pts){sxy+=(x-mx)*(y-my);sxx+=(x-mx)*(x-mx);syy+=(y-my)*(y-my);}
  const rr=sxy/Math.sqrt(sxx*syy||1),slope=sxy/(sxx||1),icpt=my-slope*mx;
  for(const[x,y]of s.pts)ball(ctx,sx(x),sy(y),4.5*DPR,"#DE9255");
  ctx.strokeStyle="#5E9FE8";ctx.lineWidth=2.6*DPR;
  ctx.beginPath();ctx.moveTo(sx(-R2),sy(slope*-R2+icpt));ctx.lineTo(sx(R2),sy(slope*R2+icpt));ctx.stroke();
  setR("stats","r",fa2(rr));setR("stats","m",fa2(slope));
 }
});

defExp("physics",{
 id:"incline",icon:"⛰️",title:"سطح شیب‌دار",
 readouts:[{id:"a",label:"شتاب"},{id:"st",label:"وضعیت"}],
 controls:[
  {type:"range",id:"ang",label:"زاویهٔ شیب (درجه)",min:5,max:45,step:1,value:20,fmt:v=>fa0(v)+"°"},
  {type:"range",id:"mu",label:"ضریب اصطکاک μ",min:0,max:1,step:.02,value:.3,fmt:v=>fa2(v)},
  {type:"buttons",items:[{id:"reset",label:"از نو",primary:true}]}
 ],
 learnTitle:"اصطکاک روی شیب",
 learnBody:'جسم وقتی می‌لغزد که مؤلفهٔ وزن در راستای شیب از اصطکاک بیشتر شود: <span class="formula">tanθ &gt; μ</span>. شتاب لغزش: <span class="formula">a = g(sinθ − μcosθ)</span>. به همین دلیل جاده‌های برفی (μ کم) خطرناک‌اند!',
 init(ex){ex.s={d:0,v:0};},
 btn(ex){ex.s.d=0;ex.s.v=0;},
 change(ex){ex.s.d=0;ex.s.v=0;},
 frame(ex,ctx,w,h,dt){
  const s=ex.s,p=ex.p,g=9.8,th=p.ang*Math.PI/180;
  const slides=Math.tan(th)>p.mu;
  const a=slides?g*(Math.sin(th)-p.mu*Math.cos(th)):0;
  if(slides){s.v+=a*dt;s.d+=s.v*dt*40;}
  const bx=w*.12,by=h*.88,L=w*.76;
  const topx=bx+L*Math.cos(0),topy=by-L*Math.sin(th);
  ctx.fillStyle="rgba(255,255,255,.08)";
  ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+L,by);ctx.lineTo(bx+L,by-L*Math.tan(th));ctx.closePath();ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.4)";ctx.lineWidth=2*DPR;ctx.stroke();
  const maxD=Math.sqrt(L*L+Math.pow(L*Math.tan(th),2))-60*DPR;
  if(s.d>maxD){s.d=maxD;s.v=0;}
  const dd=Math.min(s.d,maxD);
  const sx=bx+L-(dd+30*DPR)*Math.cos(th),sy=by-L*Math.tan(th)+(dd+30*DPR)*Math.sin(th);
  const B=26*DPR;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(-th);
  ctx.fillStyle="#5E9FE8";ctx.beginPath();ctx.roundRect(-B/2,-B,B,B,4*DPR);ctx.fill();
  ctx.restore();
  ctx.strokeStyle="#E97366";ctx.lineWidth=2.6*DPR;
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+42*DPR);ctx.stroke();
  ball(ctx,sx,sy+42*DPR,3*DPR,"#E97366");
  setR("physics","a",fa2(a)+" m/s²");
  setR("physics","st",slides?"می‌لغزد 🛝":"ساکن (اصطکاک نگه می‌دارد) ✋");
 }
});
defExp("physics",{
 id:"lens",icon:"🔍",title:"عدسی همگرا",
 readouts:[{id:"v",label:"فاصلهٔ تصویر"},{id:"m",label:"بزرگ‌نمایی"},{id:"k",label:"نوع تصویر"}],
 controls:[
  {type:"range",id:"f",label:"فاصلهٔ کانونی",min:30,max:120,step:2,value:70,fmt:v=>fa0(v)},
  {type:"range",id:"u",label:"فاصلهٔ جسم",min:35,max:300,step:5,value:180,fmt:v=>fa0(v)}
 ],
 learnTitle:"قانون عدسی نازک",
 learnBody:'<span class="formula">1/f = 1/u + 1/v</span>. اگر جسم دورتر از کانون باشد تصویر حقیقی و وارونه است (دوربین، چشم). اگر نزدیک‌تر از کانون باشد تصویر مجازی و بزرگ‌تر می‌شود — همان ذره‌بین!',
 frame(ex,ctx,w,h){
  const p=ex.p,den=p.u-p.f,v=Math.abs(den)<1e-9?Infinity:p.u*p.f/den,m=-v/p.u;
  const span=Math.max(360,p.u*1.5,Number.isFinite(v)?Math.min(Math.abs(v)*2,1400):360);
  const sc=w/span,cx=w*.52,cy=h*.5,ho=Math.min(45*DPR,h*.13),ox=cx-p.u*sc,F=p.f*sc;
  grid2(ctx,w,h,12,6);
  const line=(x1,y1,x2,y2,color,dashed=false)=>{ctx.strokeStyle=color;ctx.lineWidth=2*DPR;ctx.setLineDash(dashed?[5*DPR,5*DPR]:[]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])};
  line(0,cy,w,cy,'#ffffff55');ctx.strokeStyle='#55c9f3';ctx.lineWidth=3*DPR;ctx.beginPath();ctx.ellipse(cx,cy,8*DPR,h*.34,0,0,TAU);ctx.stroke();
  [-1,1].forEach(k=>ball(ctx,cx+k*F,cy,3*DPR,'#f8a529'));
  line(ox,cy,ox,cy-ho,'#72bc8f');ball(ctx,ox,cy-ho,4*DPR,'#72bc8f');
  line(ox,cy-ho,cx,cy-ho,'#f8a529');line(cx,cy-ho,w,cy-ho+(w-cx)*ho/F,'#f8a529');
  line(ox,cy-ho,w,cy+(w-cx)*ho/(p.u*sc),'#b69aff');
  if(Number.isFinite(v)){
   const ix=cx+v*sc,iy=cy-m*ho;
   if(v<0){line(cx,cy-ho,ix,iy,'#f8a529',true);line(cx,cy,ix,iy,'#b69aff',true)}
   line(ix,cy,ix,iy,'#fb718f',v<0);if(iy>=0&&iy<=h&&ix>=0&&ix<=w)ball(ctx,ix,iy,4*DPR,'#fb718f');
   setR('physics','v',fa1(v));setR('physics','m',fa2(m)+'×');setR('physics','k',v>0?'حقیقی و وارونه':'مجازی و مستقیم');
  }else{setR('physics','v','∞');setR('physics','m','—');setR('physics','k','در بی‌نهایت؛ پرتوهای خروجی موازی')}
 }

});
defExp("physics",{
 id:"circuit",icon:"💡",title:"قانون اهم",
 readouts:[{id:"i",label:"جریان"},{id:"pw",label:"توان"}],
 controls:[
  {type:"range",id:"V",label:"ولتاژ (V)",min:1,max:24,step:.5,value:9,fmt:v=>fa1(v)},
  {type:"range",id:"R",label:"مقاومت (Ω)",min:1,max:24,step:.5,value:6,fmt:v=>fa1(v)}
 ],
 learnTitle:"قانون اهم",
 learnBody:'<span class="formula">I = V / R</span> — جریان با ولتاژ زیاد و با مقاومت کم می‌شود. توان لامپ: <span class="formula">P = V·I</span>. الکترون‌ها را ببینید: هرچه جریان بیشتر، سریع‌تر می‌چرخند و لامپ پرنورتر است.',
 init(ex){ex.s={ph:0};},
 frame(ex,ctx,w,h,dt){
  const s=ex.s,p=ex.p,I=p.V/p.R,P=p.V*I;
  s.ph=(s.ph+dt*I*.15)%1;
  const x0=w*.18,x1=w*.82,y0=h*.2,y1=h*.8;
  ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=2.4*DPR;
  ctx.strokeRect(x0,y0,x1-x0,y1-y0);
  ctx.fillStyle="#151030";
  ctx.fillRect(x0-16*DPR,(y0+y1)/2-26*DPR,32*DPR,52*DPR);
  ctx.strokeStyle="#EAC26B";ctx.lineWidth=2.4*DPR;
  ctx.beginPath();ctx.moveTo(x0-8*DPR,(y0+y1)/2-16*DPR);ctx.lineTo(x0+8*DPR,(y0+y1)/2-16*DPR);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x0-4*DPR,(y0+y1)/2+16*DPR);ctx.lineTo(x0+4*DPR,(y0+y1)/2+16*DPR);ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.6)";ctx.font=(11*DPR)+"px Vazirmatn,Tahoma";ctx.textAlign="center";
  ctx.fillText("باتری",x0,(y0+y1)/2+44*DPR);
  const glow=Math.min(1,P/40);
  const bx2=x1,by2=(y0+y1)/2;
  const gr=ctx.createRadialGradient(bx2,by2,2,bx2,by2,60*DPR*(0.3+glow));
  gr.addColorStop(0,"rgba(234,194,107,"+(0.25+glow*.75)+")");
  gr.addColorStop(1,"rgba(234,194,107,0)");
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(bx2,by2,60*DPR*(0.3+glow),0,TAU);ctx.fill();
  ball(ctx,bx2,by2,14*DPR,glow>.5?"#EAC26B":"#8a7440");
  ctx.fillStyle="rgba(255,255,255,.6)";ctx.fillText("لامپ",bx2,by2+44*DPR);
  const zx=(x0+x1)/2,zw=50*DPR;
  ctx.strokeStyle="#E97366";ctx.lineWidth=2.4*DPR;ctx.beginPath();
  ctx.moveTo(zx-zw,y0);
  for(let i=0;i<6;i++)ctx.lineTo(zx-zw+zw*2*(i+.5)/6,y0+(i%2?9:-9)*DPR);
  ctx.lineTo(zx+zw,y0);ctx.stroke();
  ctx.fillText("مقاومت",zx,y0-14*DPR);
  const per=2*((x1-x0)+(y1-y0));
  const N=14;
  for(let i=0;i<N;i++){
   let d=((i/N+s.ph)%1)*per;
   let X,Y;
   if(d<x1-x0){X=x0+d;Y=y0;}
   else if(d<(x1-x0)+(y1-y0)){X=x1;Y=y0+(d-(x1-x0));}
   else if(d<2*(x1-x0)+(y1-y0)){X=x1-(d-(x1-x0)-(y1-y0));Y=y1;}
   else{X=x0;Y=y1-(d-2*(x1-x0)-(y1-y0));}
   ball(ctx,X,Y,3.2*DPR,"#5E9FE8");
  }
  setR("physics","i",fa2(I)+" A");setR("physics","pw",fa1(P)+" W");
 }
});
defExp("physics",{
 id:"doppler",icon:"🚑",title:"اثر دوپلر",
 readouts:[{id:"fa",label:"بسامد جلو"},{id:"fb",label:"بسامد پشت"}],
 controls:[
  {type:"range",id:"v",label:"سرعت منبع (نسبت به صوت)",min:0,max:.9,step:.05,value:.5,fmt:v=>fa0(v*100)+"٪"}
 ],
 learnTitle:"چرا صدای آمبولانس عوض می‌شود؟",
 learnBody:'وقتی منبع صدا حرکت می‌کند، موج‌ها جلوی آن فشرده (بسامد بالاتر، صدای زیرتر) و پشت آن باز می‌شوند (بم‌تر): <span class="formula">f′ = f / (1 ∓ v/c)</span>. ستاره‌شناسان با همین اثر روی نور، دور شدن کهکشان‌ها را کشف کردند!',
 init(ex){ex.s={waves:[],x:0,t:0};},
 frame(ex,ctx,w,h,dt){
  const s=ex.s,p=ex.p,c=w*.13;
  s.t+=dt;
  s.x+=p.v*c*dt;
  if(s.x>w*.75)s.x=-w*.2;
  if(!s.last||s.t-s.last>.4){s.last=s.t;s.waves.push({x:s.x,y:h/2,r:0});}
  s.waves=s.waves.filter(wv=>wv.r<w);
  for(const wv of s.waves){
   wv.r+=c*dt;
   ctx.strokeStyle="rgba(94,159,232,"+Math.max(0,.8-wv.r/w)+")";
   ctx.lineWidth=2*DPR;
   ctx.beginPath();ctx.arc(wv.x,wv.y,wv.r,0,TAU);ctx.stroke();
  }
  const sx=Math.max(0,s.x);
  ctx.font=(30*DPR)+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("🚑",sx,h/2);ctx.textBaseline="alphabetic";
  setR("physics","fa",fa2(1/(1-p.v))+"×");
  setR("physics","fb",fa2(1/(1+p.v))+"×");
 }
});
defExp("physics",{

 readouts:[{id:"st",label:"وضعیت"},{id:"fr",label:"بخش زیر آب"}],
 controls:[
  {type:"range",id:"rho",label:"چگالی جسم (g/cm³)",min:.2,max:3,step:.05,value:.6,fmt:v=>fa2(v)},
  {type:"choices",id:"fluid",value:"1",items:[{val:".9",label:"روغن ۰٫۹"},{val:"1",label:"آب ۱٫۰"},{val:"1.25",label:"آب‌نمک ۱٫۲۵"}]}
 ],
 learnTitle:"اصل ارشمیدس",
 learnBody:'نیروی شناوری برابر وزن سیالِ جابه‌جاشده است. اگر چگالی جسم کمتر از سیال باشد شناور می‌ماند و کسری از آن زیر آب می‌رود که برابر <span class="formula">ρ جسم / ρ سیال</span> است. کشتی فولادی چون توخالی است چگالی میانگینش از آب کمتر است!',
 init(ex){ex.s={y:0,vy:0,t:0};},
 frame(ex,ctx,w,h,dt){
  const s=ex.s,p=ex.p,rf=parseFloat(p.fluid);
  s.t+=dt;
  const wl=h*.45;
  ctx.fillStyle=rf>1.1?"rgba(114,188,143,.25)":rf<1?"rgba(234,194,107,.18)":"rgba(94,159,232,.22)";
  ctx.fillRect(0,wl,w,h-wl);
  ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1.6*DPR;
  ctx.beginPath();
  for(let i=0;i<=40;i++){const X=w*i/40;const Y=wl+Math.sin(i/3+s.t*2)*2.5*DPR;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.stroke();
  const B=64*DPR;
  const frac=Math.min(1,p.rho/rf);
  const targetTop=p.rho<rf? wl-B*(1-frac) : h-B-14*DPR;
  s.y+=(targetTop-s.y)*Math.min(1,dt*2.5);
  const bob=p.rho<rf?Math.sin(s.t*2.2)*2*DPR:0;
  const X=w/2-B/2,Y=s.y+bob;
  ctx.fillStyle=p.rho<rf?"#DE9255":"#8a8a8a";
  ctx.beginPath();ctx.roundRect(X,Y,B,B,6*DPR);ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.3)";
  const sub=Math.max(0,Math.min(B,(wl-Y)*-1+ (Y+B>wl? Math.min(B,Y+B-wl):0)));
  if(Y+B>wl){const d=Math.min(B,Y+B-wl);ctx.fillRect(X,Y+B-d,B,d);}
  setR("physics","st",p.rho<rf?"شناور 🛟":"غرق می‌شود ⬇️");
  setR("physics","fr",p.rho<rf?fa0(frac*100)+"٪":"۱۰۰٪");
 }
});

 ],
 learnTitle:"a² + b² = c²",
 learnBody:'در مثلث قائم‌الزاویه، مساحت مربع روی وتر برابر مجموع مساحت دو مربع دیگر است. مثلث ۳-۴-۵ را امتحان کنید: ۹+۱۶=۲۵! معماران مصر باستان با طناب ۱۲گره‌ای زاویهٔ قائمه می‌ساختند.',
 frame(ex,ctx,w,h){
  const{a,b}=ex.p,c=Math.hypot(a,b);
  const sc=Math.min(w,h)/(a+b+Math.max(a,b)+3.5);
  const ox=w*.5-(b*sc)/2,oy=h*.55;
  const A={x:ox,y:oy},B={x:ox+b*sc,y:oy},C={x:ox,y:oy-a*sc};
  ctx.fillStyle="rgba(94,159,232,.3)";ctx.strokeStyle="#5E9FE8";ctx.lineWidth=1.6*DPR;
  ctx.fillRect(A.x-a*sc,C.y,a*sc,a*sc);ctx.strokeRect(A.x-a*sc,C.y,a*sc,a*sc);
  ctx.fillStyle="rgba(222,146,85,.3)";ctx.strokeStyle="#DE9255";
  ctx.fillRect(A.x,oy,b*sc,b*sc);ctx.strokeRect(A.x,oy,b*sc,b*sc);
  const ux=(B.x-C.x)/(c*sc),uy=(B.y-C.y)/(c*sc);
  const nx=-uy,ny=ux;
  ctx.fillStyle="rgba(191,142,218,.3)";ctx.strokeStyle="#BF8EDA";
  ctx.beginPath();
  ctx.moveTo(C.x,C.y);ctx.lineTo(B.x,B.y);
  ctx.lineTo(B.x+nx*c*sc,B.y+ny*c*sc);ctx.lineTo(C.x+nx*c*sc,C.y+ny*c*sc);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.12)";ctx.strokeStyle="#fff";ctx.lineWidth=2.2*DPR;
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.lineTo(C.x,C.y);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=1.6*DPR;
  ctx.strokeRect(A.x,A.y-12*DPR,12*DPR,12*DPR);
  ctx.fillStyle="#fff";ctx.font="700 "+(13*DPR)+"px Vazirmatn,Tahoma";ctx.textAlign="center";
  ctx.fillText("a",A.x-16*DPR,(A.y+C.y)/2);
  ctx.fillText("b",(A.x+B.x)/2,A.y+18*DPR);
  ctx.fillText("c",(C.x+B.x)/2+nx*14*DPR,(C.y+B.y)/2+ny*14*DPR);
  setR("math","a2",fa1(a*a));setR("math","b2",fa1(b*b));
  setR("math","c2",fa1(a*a)+" + "+fa1(b*b)+" = "+fa1(c*c));
 }
});

 id:"koch",icon:"❄️",title:"برف‌دانهٔ کخ",

 ],
 learnTitle:"محیط بی‌نهایت، مساحت محدود",
 learnBody:'در هر مرحله وسط هر ضلع یک دندانهٔ مثلثی سبز می‌شود و محیط ۴/۳ برابر می‌شود — تا بی‌نهایت! اما مساحت هرگز از یک حد معین بیشتر نمی‌شود. سواحل واقعی هم همین‌طورند: هرچه خط‌کش کوچک‌تر، ساحل طولانی‌تر!',
 frame(ex,ctx,w,h){
  const it=ex.p.it;
  const cx=w/2,cy=h*.56,R=Math.min(w,h)*.36;
  let pts=[];
  for(let i=0;i<3;i++){const a=-Math.PI/2+i*TAU/3;pts.push([cx+Math.cos(a)*R,cy+Math.sin(a)*R]);}
  for(let k=0;k<it;k++){
   const np=[];
   for(let i=0;i<pts.length;i++){
    const A=pts[i],B=pts[(i+1)%pts.length];
    const dx=B[0]-A[0],dy=B[1]-A[1];
    const P1=[A[0]+dx/3,A[1]+dy/3],P2=[A[0]+dx*2/3,A[1]+dy*2/3];
    const mx2=A[0]+dx/2-dy*Math.sqrt(3)/6,my=A[1]+dy/2+dx*Math.sqrt(3)/6;
    np.push(A,P1,[mx2,my],P2);
   }
   pts=np;
  }
  ctx.strokeStyle="#BF8EDA";ctx.lineWidth=Math.max(1,2.2-it*.35)*DPR;
  ctx.beginPath();
  for(let i=0;i<pts.length;i++)i?ctx.lineTo(pts[i][0],pts[i][1]):ctx.moveTo(pts[i][0],pts[i][1]);
  ctx.closePath();ctx.stroke();
  setR("math","per",fa2(Math.pow(4/3,it)*3)+" واحد");
  setR("math","segs",fa0(3*Math.pow(4,it)));
 }
});
defExp("math",{
 id:"sorting",icon:"📊",title:"مرتب‌سازی دیدنی",
 readouts:[{id:"cmp",label:"مقایسه‌ها"},{id:"swp",label:"جابه‌جایی‌ها"}],
 controls:[
  {type:"choices",id:"algo",value:"bubble",items:[{val:"bubble",label:"حبابی"},{val:"select",label:"انتخابی"}]},
  {type:"range",id:"speed",label:"سرعت",min:1,max:30,step:1,value:8,fmt:v=>fa0(v)},
  {type:"buttons",items:[{id:"shuffle",label:"بُر بزن"},{id:"start",label:"مرتب کن!",primary:true}]}
 ],
 learnTitle:"الگوریتم یعنی دستور آشپزی",
 learnBody:'مرتب‌سازی حبابی همسایه‌های نامرتب را جابه‌جا می‌کند تا بزرگ‌ترها مثل حباب بالا بیایند؛ انتخابی هر بار کوچک‌ترین را پیدا می‌کند و سر جایش می‌گذارد. تعداد مقایسه‌ها را مقایسه کنید — به همین دلیل مهندسان برای میلیون‌ها داده الگوریتم‌های باهوش‌تری مثل مرتب‌سازی ادغامی ساختند.',
 init(ex){
  const s=ex.s={arr:[],i:0,j:0,mi:0,run:false,cmp:0,swp:0,acc:0,hi:[-1,-1]};
  for(let k=0;k<30;k++)s.arr.push(k+1);
  for(let k=s.arr.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[s.arr[k],s.arr[r]]=[s.arr[r],s.arr[k]];}
 },
 btn(ex,id){
  const s=ex.s;
  if(id==="shuffle"){ex.init(ex);return;}
  if(id==="start"){s.run=true;s.i=0;s.j=0;s.mi=0;s.cmp=0;s.swp=0;}
 },
 change(ex,id){if(id==="algo")ex.init(ex);},
 frame(ex,ctx,w,h,dt){
  const s=ex.s,n=s.arr.length;
  if(s.run){
   s.acc+=dt*ex.p.speed;
   while(s.acc>=1&&s.run){
    s.acc-=1;
    if(ex.p.algo==="bubble"){
     if(s.j>=n-1-s.i){s.j=0;s.i++;}
     if(s.i>=n-1){s.run=false;s.hi=[-1,-1];break;}
     s.cmp++;s.hi=[s.j,s.j+1];
     if(s.arr[s.j]>s.arr[s.j+1]){[s.arr[s.j],s.arr[s.j+1]]=[s.arr[s.j+1],s.arr[s.j]];s.swp++;}
     s.j++;
    }else{
     if(s.j>=n){
      if(s.mi!==s.i){[s.arr[s.i],s.arr[s.mi]]=[s.arr[s.mi],s.arr[s.i]];s.swp++;}
      s.i++;s.mi=s.i;s.j=s.i+1;
      if(s.i>=n-1){s.run=false;s.hi=[-1,-1];break;}
     }else{
      s.cmp++;s.hi=[s.j,s.mi];
      if(s.arr[s.j]<s.arr[s.mi])s.mi=s.j;
      s.j++;
     }
    }
   }
  }
  const bx=w*.06,bw=w*.88,by=h*.86,bh=h*.68;
  const cw=bw/n;
  for(let k=0;k<n;k++){
   const v=s.arr[k];
   ctx.fillStyle=(k===s.hi[0]||k===s.hi[1])?"#EAC26B":"#BF8EDA";
   ctx.fillRect(bx+k*cw+1.5*DPR,by-v/n*bh,cw-3*DPR,v/n*bh);
  }
  setR("math","cmp",fa0(s.cmp));
  setR("math","swp",fa0(s.swp));
 }
});

defExp("stats",{
 id:"sampling",icon:"🗳️",title:"نظرسنجی و خطای نمونه‌گیری",

 controls:[

 ],
 learnTitle:"چرا نظرسنجی‌ها گاهی اشتباه می‌کنند؟",
 learnBody:'با نمونهٔ کوچک، برآوردها پخش‌وپلا می‌شوند. خطای آماری با <span class="formula">±۱/۹۶ √(p(1−p)/n)</span> کوچک می‌شود — اما برای نصف شدن خطا باید نمونه را ۴ برابر کنید! برای همین نظرسنجی‌های معتبر حدود ۱۰۰۰ نفر می‌پرسند، نه ۱۰۰ هزار نفر.',
 init(ex){ex.s={ests:[],last:null,flash:0};},
 change(ex){ex.s.ests=[];ex.s.last=null;},
 btn(ex,id){
  const s=ex.s,p=ex.p.p,n=ex.p.n;
  if(id==="reset"){s.ests=[];s.last=null;return;}
  const runs=id==="many"?50:1;
  for(let r=0;r<runs;r++){
   let yes=0;for(let i=0;i<n;i++)if(Math.random()<p)yes++;
   s.last=yes/n;s.ests.push(s.last);
  }
  if(s.ests.length>400)s.ests=s.ests.slice(-400);
  s.flash=1;
 },
 frame(ex,ctx,w,h,dt){
  const s=ex.s,p=ex.p.p,n=ex.p.n;
  s.flash=Math.max(0,s.flash-dt*2);
  const bx=w*.08,bw=w*.84,by=h*.78,bh=h*.58;
  const bins=40,hist=new Array(bins).fill(0);
  for(const e of s.ests){const b2=Math.min(bins-1,Math.max(0,Math.floor(e*bins)));hist[b2]++;}
  const mx=Math.max(1,...hist);
  for(let b2=0;b2<bins;b2++){
   if(!hist[b2])continue;
   const X=bx+b2/bins*bw,bhh=hist[b2]/mx*bh;
   ctx.fillStyle="#DE9255";
   ctx.fillRect(X,by-bhh,bw/bins-2*DPR,bhh);
  }
  const px=bx+p*bw;
  ctx.strokeStyle="#EAC26B";ctx.lineWidth=2.4*DPR;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(px,by-bh);ctx.lineTo(px,by+8*DPR);ctx.stroke();ctx.setLineDash([]);
  ctx.font=(12*DPR)+"px Vazirmatn,Tahoma";ctx.textAlign="center";ctx.fillStyle="#EAC26B";
  ctx.fillText("واقعی: "+fa0(p*100)+"٪",px,by-bh-8*DPR);
  if(s.last!==null){
   const lx=bx+s.last*bw;
   ball(ctx,lx,by+16*DPR,5*DPR,"rgba(233,115,102,"+(0.4+s.flash*.6)+")");
  }
  ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=1.4*DPR;
  ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+bw,by);ctx.stroke();
  const err=1.96*Math.sqrt(p*(1-p)/n);
  setR("stats","est",s.last===null?"—":fa1(s.last*100)+"٪");
  setR("stats","err",fa1(err*100)+"٪");
 }
});

defExp("stats",{
 id:"simpson",icon:"🔀",title:"پارادوکس سیمپسون",

 learnBody:'روند کلی صعودی است، اما درون هر گروه نزولی! چون گروه‌ها جابه‌جا متفاوتند، ترکیب کردنشان جهت رابطه را برعکس نشان می‌دهد. دانشگاه برکلی یک‌بار به تبعیض جنسیتی متهم شد — اما با تفکیک دانشکده‌ها معلوم شد قضیه برعکس است. همیشه بپرسید: داده را چطور گروه‌بندی کرده‌اید؟',

 },

   const n=pts.length;let sx=0,sy=0,sxy=0,sxx=0;

 change(ex){ex.btn(ex,"run");},
 frame(ex,ctx,w,h){
  const s=ex.s,pss=ex.p.pss,prr=ex.p.prr;
  const cols=25,rows=8,cw=w*.84/cols,ch=Math.min(h*.6/rows,cw);
  const ox=w*.08,oy=h*.12;
  let nSun=0;
  for(let i=0;i<s.days.length;i++){
   const c2=i%cols,r2=Math.floor(i/cols);
   ctx.fillStyle=s.days[i]?"#DE9255":"#5E9FE8";
   if(s.days[i])nSun++;
   ctx.fillRect(ox+c2*cw,oy+r2*ch,cw-2*DPR,ch-2*DPR);
  }
  const frac=nSun/s.days.length,th=(1-prr)/((1-pss)+(1-prr));
  const by=oy+rows*ch+h*.06,bw=w*.84,bh2=14*DPR;
  ctx.fillStyle="rgba(255,255,255,.12)";ctx.fillRect(ox,by,bw,bh2);
  ctx.fillStyle="#DE9255";ctx.fillRect(ox,by,bw*frac,bh2);
  ctx.strokeStyle="#EAC26B";ctx.lineWidth=2.4*DPR;
  ctx.beginPath();ctx.moveTo(ox+bw*th,by-5*DPR);ctx.lineTo(ox+bw*th,by+bh2+5*DPR);ctx.stroke();
  ctx.font=(12*DPR)+"px Vazirmatn,Tahoma";ctx.textAlign="center";ctx.fillStyle="rgba(255,255,255,.6)";
  ctx.fillText("█ آفتابی █ بارانی — خط طلایی: پیش‌بینی نظری",w/2,by+bh2+22*DPR);
  setR("stats","sim",fa0(frac*100)+"٪");
  setR("stats","th",fa0(th*100)+"٪");
 }
});

/* ============ BOOT ============ */
const nav=document.getElementById("nav");
Object.keys(SUBJECTS).forEach(k=>{
 const S=SUBJECTS[k];
 const b=document.createElement("button");
 b.className="tab";b.dataset.tab=k;
 b.innerHTML='<span class="ico">'+S.ico+'</span>'+S.label;
 b.style.setProperty("--acc",S.acc);
 b.style.setProperty("--soft",S.soft);
 b.addEventListener("click",()=>setTab(k,true));
 nav.appendChild(b);
 const panel=document.getElementById("panel-"+k);
 panel.style.setProperty("--acc",S.acc);
 panel.style.setProperty("--accL",S.accL);
 panel.style.setProperty("--soft",S.soft);
 panel.style.setProperty("--bord",S.bord);
 const bar=document.getElementById("exps-"+k);
 REG[k].forEach(e=>{
  const eb=document.createElement("button");
  eb.className="exp";eb.dataset.id=e.id;
  eb.innerHTML='<span class="eico">'+e.icon+'</span><span>'+e.title+'</span>';
  eb.addEventListener("click",()=>selectExp(k,e.id,true));
  bar.appendChild(eb);
 });
 const cv=document.getElementById("cv-"+k);
 CVS[k]=cv;CTX[k]=cv.getContext("2d");
 attachPointer(k);
});
/* select defaults for every subject (no canvas work yet) */
Object.keys(SUBJECTS).forEach(k=>selectExp(k,REG[k][0].id,false));
/* hash routing: #subj/expId */
(function(){
 const h=(location.hash||"").replace("#","");
 let subj="physics",eid=null;
 if(h){
  const parts=h.split("/");
  if(SUBJECTS[parts[0]])subj=parts[0];
  if(parts[1])eid=parts[1];
 }
 if(eid&&REG[subj].some(e=>e.id===eid))selectExp(subj,eid,false);
 setTab(subj,false);
})();
window.addEventListener("hashchange",()=>{
 const h=(location.hash||"").replace("#","");
 if(!h)return;
 const parts=h.split("/");
 if(!SUBJECTS[parts[0]])return;
 if(parts[1]&&REG[parts[0]].some(e=>e.id===parts[1])&&(CUR.subj!==parts[0]||CUR.exp[parts[0]].id!==parts[1]))selectExp(parts[0],parts[1],false);
 if(CUR.subj!==parts[0])setTab(parts[0],false);
});
/* main loop */
let last=performance.now();
function loop(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 const k=CUR.subj,ex=CUR.exp[k];
 if(ex){
  const cv=CVS[k],{w,h}=fitCanvas(cv),ctx=CTX[k];
  if(!window.vuraPaused)ctx.clearRect(0,0,w,h);
  try{if(!window.vuraPaused)ex.frame(ex,ctx,w,h,dt,now/1000);}catch(err){console.error(ex.id,err);window.vuraErrors=window.vuraErrors||[];if(!window.vuraErrors.some(x=>x.id===ex.id))window.vuraErrors.push({id:ex.id,message:String(err)});const hint=$("#hint-"+k);hint.textContent="خطای اجرا — آزمایش را بازنشانی کنید / Simulation error — reset";hint.style.display="";}
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.vuraPaused=false;window.vuraErrors=[];
const tools=document.createElement('div');tools.className='vuraTools';
tools.innerHTML='<input id="labSearch" type="search" aria-label="جست‌وجوی آزمایش" placeholder="جست‌وجو در ۶۸ آزمایش…"><button id="labPause">⏸ توقف</button><button id="labReset">↺ بازنشانی</button>';
document.getElementById('nav').before(tools);
const counter=document.createElement('div');counter.className='vuraCount';tools.after(counter);
const search=document.getElementById('labSearch');
search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();let found=0;document.querySelectorAll('.exp').forEach(b=>{const e=Object.values(REG).flat().find(x=>x.id===b.dataset.id);const ok=(b.textContent+' '+e.id+' '+e.learnTitle).toLowerCase().includes(q);b.hidden=!ok;b.style.display=ok?'':'none';if(ok)found++});counter.textContent=q?found+' آزمایش در چهار دسته پیدا شد':'';if(q){const match=Object.keys(REG).find(k=>REG[k].some(e=>(e.title+' '+e.id+' '+e.learnTitle).toLowerCase().includes(q)));if(match)setTab(match,true)}});
document.getElementById('labPause').onclick=e=>{window.vuraPaused=!window.vuraPaused;e.target.textContent=window.vuraPaused?'▶ ادامه':'⏸ توقف';e.target.classList.toggle('active',window.vuraPaused)};
document.getElementById('labReset').onclick=()=>{const ex=CUR.exp[CUR.subj];selectExp(CUR.subj,ex.id,true);window.vuraPaused=false;document.getElementById('labPause').textContent='⏸ توقف';document.getElementById('labPause').classList.remove('active')};
window.vuraSnapshot=()=>{const cv=CVS[CUR.subj];const out=document.createElement('canvas');out.width=cv.width;out.height=cv.height;const ctx=out.getContext('2d');ctx.fillStyle='#15122e';ctx.fillRect(0,0,out.width,out.height);ctx.drawImage(cv,0,0);return out.toDataURL('image/png')};

</script>
