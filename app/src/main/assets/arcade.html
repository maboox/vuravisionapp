<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141417">
<title>دوئل دو نفره | Two-Player Duel</title>
<style>
:root{--bg:#141417;--surface:#1D1D22;--raised:#2A2A31;--border:rgba(255,255,255,.12);--text:#fff;--sub:rgba(255,255,255,.65);--p1:#F2708A;--p2:#5E9FE8;--good:#72BC8F;--bad:#E97366;--warn:#EAC26B}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{position:fixed;inset:0;width:100%;background:var(--bg);color:var(--text);font-family:'Vazirmatn','Noto Sans Arabic',-apple-system,'Segoe UI',Tahoma,sans-serif;overflow:hidden}
button{color:inherit;background:none;border:none;cursor:pointer;font:inherit}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}
/* menu */
#menu{flex-direction:column;overflow-y:auto;touch-action:pan-y;padding:36px 20px 40px;align-items:center}
.menuHead{text-align:center;max-width:560px;margin-bottom:20px}
.logo{font-size:44px;margin-bottom:10px}
.menuHead h1{font-size:28px;font-weight:800;margin-bottom:10px}
.menuHead p{font-size:14.5px;line-height:1.8;color:var(--sub)}
.optBox{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.optTitle{font-size:14px;font-weight:700;margin-bottom:10px}
.seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:5px}
.seg button{flex:1;min-height:44px;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--sub);border:1px solid transparent}
.seg .segOn{background:var(--raised);color:#fff;border-color:var(--border)}
.optDesc{margin-top:10px;font-size:12.5px;color:var(--sub);line-height:1.7}
#gameList{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;width:100%;max-width:560px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 14px 14px;text-align:start;display:flex;flex-direction:column;gap:7px;transition:transform .1s}
.card:active{transform:scale(.97);background:var(--raised)}
.cardIcon{font-size:30px}
.cardName{font-size:16.5px;font-weight:700}
.cardDesc{font-size:12.5px;color:var(--sub);line-height:1.65;flex:1}
.cardTag{align-self:flex-start;font-size:11px;padding:3px 10px;border-radius:99px;background:rgba(94,159,232,.15);color:#9CC4F0}
.hint{margin-top:26px;font-size:12.5px;color:var(--sub);text-align:center;line-height:1.9;max-width:480px}
/* game shell */
#game{flex-direction:column;touch-action:none;direction:ltr}
.half{flex:1;position:relative;overflow:hidden;direction:rtl}
body.en .half{direction:ltr}
.half.top{transform:rotate(180deg);background:linear-gradient(to bottom,rgba(94,159,232,.02),rgba(94,159,232,.10))}
.half.bottom{background:linear-gradient(to bottom,rgba(242,112,138,.02),rgba(242,112,138,.10))}
.divider{height:2px;background:rgba(255,255,255,.14);z-index:5}
.fab{position:absolute;z-index:40;width:46px;height:46px;border-radius:50%;background:rgba(42,42,49,.94);border:1px solid var(--border);font-size:17px;display:flex;align-items:center;justify-content:center}
.fab.exit{left:10px;top:50%;transform:translateY(-50%)}
.scorePill{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;background:rgba(42,42,49,.94);border:1px solid var(--border);border-radius:99px;padding:9px 12px;gap:3px;font-weight:800;font-size:16px;line-height:1}
.scorePill i{width:16px;height:1px;background:var(--border)}
#sTop{color:var(--p2);transform:rotate(180deg)}
#sBot{color:var(--p1)}
/* landscape */
body.landscape #game{flex-direction:row}
body.landscape .half.top{transform:none;background:linear-gradient(to left,rgba(94,159,232,.02),rgba(94,159,232,.10))}
body.landscape .half.bottom{background:linear-gradient(to right,rgba(242,112,138,.02),rgba(242,112,138,.10))}
body.landscape .divider{height:auto;width:2px}
body.landscape .fab.exit{left:50%;top:10px;transform:translateX(-50%)}
body.landscape .scorePill{right:auto;left:50%;top:auto;bottom:10px;transform:translateX(-50%);flex-direction:row;padding:10px 14px;gap:8px}
body.landscape .scorePill i{width:1px;height:16px}
body.landscape #sTop{transform:none}
body.landscape .matchOverlay{flex-direction:row}
body.landscape .moHalf.moTop{transform:none;border-bottom:none;border-left:1px solid var(--border)}
body.landscape .tugTrack{left:4%;right:4%;top:50%;bottom:auto;width:auto;height:12px;transform:translateY(-50%)}
body.landscape .tz{left:auto;right:auto;top:-4px;bottom:-4px}
body.landscape .tz.t{left:0;width:10%;height:auto}
body.landscape .tz.b{right:0;width:10%;height:auto}
body.landscape .c4Board{width:min(42vw,64vh)}
body.landscape .tttBoard{width:min(34vw,56vh)}
/* shared game bits */
.pad{position:absolute;inset:12px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;border:1.5px dashed rgba(255,255,255,.13)}
.padIcon{font-size:38px}
.padBig{font-size:29px;font-weight:800}
.padHuge{font-size:70px;font-weight:800;line-height:1.15}
.padSub{font-size:13px;color:var(--sub);line-height:1.7;max-width:88%}
.pad.wait{background:rgba(233,115,102,.10)}
.pad.go{background:rgba(114,188,143,.22);border-color:var(--good)}
.pad.tapzone{background:rgba(255,255,255,.03)}
.pad.tapzone:active{background:rgba(255,255,255,.07)}
.flash{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,12,.74);font-size:22px;font-weight:800;text-align:center;padding:20px;line-height:1.8}
.padWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.qWrap{display:flex;flex-direction:column;align-items:center;gap:13px;width:100%;padding:12px}
.question{font-size:36px;font-weight:800}
.qBig{font-size:54px;font-weight:800;line-height:1.2}
.optGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(320px,86%)}
.optRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(340px,90%)}
.optRow .opt{flex:1;min-width:64px}
.btn{min-height:48px;padding:10px 18px;border-radius:12px;background:var(--raised);border:1px solid var(--border);font-size:16.5px;font-weight:700}
.btn.primary{background:#2783DE;border-color:transparent}
.btn.opt{font-size:19px}
.btn.badBtn{background:rgba(233,115,102,.25);border-color:var(--bad);opacity:.65}
.btn.goodBtn{background:rgba(114,188,143,.3);border-color:var(--good)}
.numRow{display:flex;gap:12px;width:min(340px,88%)}
.numRow .btn{flex:1}
.btn.num{flex:1;font-size:36px;font-weight:800;padding:16px 8px}
.stroopWord{font-size:50px;font-weight:800}
.qNote{font-size:11.5px}
/* tug */
.tugTrack{position:absolute;left:50%;top:4%;bottom:4%;width:12px;transform:translateX(-50%);z-index:8;pointer-events:none;background:rgba(255,255,255,.08);border-radius:99px}
.tz{position:absolute;left:-4px;right:-4px;border-radius:99px}
.tz.t{top:0;height:10%;background:rgba(94,159,232,.45)}
.tz.b{bottom:0;height:10%;background:rgba(242,112,138,.45)}
.tugKnot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.15);transition:top .08s linear,left .08s linear}
/* dots-style spawners */
.trapHud{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:13.5px;color:var(--sub);z-index:6}
.trapDot{position:absolute;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:4}
.trapDot.gem{background:rgba(114,188,143,.25);border:2px solid var(--good)}
.trapDot.bomb{background:rgba(233,115,102,.2);border:2px solid var(--bad)}
.trapDot.mole{background:rgba(234,194,107,.2);border:2px solid var(--warn)}
.numDot{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--raised);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;z-index:4}
/* pong */
.pongCv{position:absolute;inset:0;z-index:15;touch-action:none}
/* boards */
.tttBoard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(62vw,40vh);transition:opacity .3s}
.tttCell{background:var(--raised);border:1px solid var(--border);border-radius:12px;font-size:clamp(24px,6vh,44px);font-weight:800;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.tttCell.m0{color:var(--p1)}
.tttCell.m1{color:var(--p2)}
.tttCell.winCell{background:rgba(114,188,143,.3);border-color:var(--good)}
.tttTurn{position:absolute;bottom:9%;left:0;right:0;text-align:center;font-size:17px;color:var(--sub);z-index:6}
.c4Board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:5px;width:min(88vw,48vh);aspect-ratio:7/6;background:rgba(255,255,255,.06);padding:8px;border-radius:14px;transition:opacity .3s}
.c4Cell{background:var(--bg);border-radius:50%;border:1px solid var(--border)}
.c4Cell.c4p0{background:var(--p1);border-color:var(--p1)}
.c4Cell.c4p1{background:var(--p2);border-color:var(--p2)}
.c4Cell.winCell{box-shadow:0 0 0 3px var(--good)}
/* misc games */
.dotBox{position:relative;width:min(78%,300px);height:120px;background:var(--raised);border-radius:12px;border:1px solid var(--border)}
.dotBox i{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff}
.dotBox b{position:absolute;font-size:22px;transform:translate(-50%,-50%)}
.arrowShow{font-size:64px;line-height:1}
.arrowBtn span{font-size:26px}
.oddGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(320px,88%)}
.oddCell{font-size:27px;background:var(--raised);border:1px solid var(--border);border-radius:10px;padding:6px;min-height:48px}
.nrGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(300px,86%)}
.nrGrid.cols3{grid-template-columns:repeat(3,1fr)}
.nrCell{font-size:20px;font-weight:700;background:var(--raised);border:1px solid var(--border);border-radius:10px;min-height:46px}
.nrCell.doneCell{opacity:.22}
.nrCell.errCell{background:rgba(233,115,102,.4)}
.swatchBig{width:120px;height:120px;border-radius:16px}
.swatchRow{display:flex;gap:10px;justify-content:center}
.swatch{width:60px;height:60px;border-radius:12px;border:2px solid rgba(255,255,255,.25)}
.tbar{position:relative;width:min(80%,340px);height:18px;background:var(--raised);border-radius:99px;border:1px solid var(--border)}
.tzoneC{position:absolute;left:43%;width:14%;top:0;bottom:0;background:rgba(114,188,143,.5);border-radius:99px}
.tmark{position:absolute;top:-5px;width:6px;height:28px;background:#fff;border-radius:3px;left:0}
.swBarWrap{width:min(70%,300px);height:12px;background:var(--raised);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.swBar{height:100%;width:0;background:var(--good);border-radius:99px}
.patGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(210px,66%)}
.patCell{aspect-ratio:1;background:var(--raised);border:1px solid var(--border);border-radius:8px}
.patCell.onCell{background:var(--p2);border-color:var(--p2)}
.circRow{display:flex;gap:16px;align-items:center;justify-content:center;min-height:112px}
.circBtn{display:flex;align-items:center;justify-content:center;width:110px;height:110px}
.circBtn span{display:block;border-radius:50%;background:var(--warn)}
.simonShow{width:110px;height:110px;border-radius:16px;background:var(--raised);opacity:.25;transition:opacity .12s,background .1s}
.simonGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(240px,74%)}
.simonBtn{border-radius:12px;border:2px solid rgba(255,255,255,.2);min-height:52px}
.rpsRow{display:flex;gap:10px}
.rpsBtn{font-size:34px;padding:12px 16px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(220px,68%)}
.keypad button{min-height:44px;font-size:19px;font-weight:700;background:var(--raised);border:1px solid var(--border);border-radius:10px}
.pinShow{font-size:32px;font-weight:800;letter-spacing:6px}
.pinProg{font-size:24px;letter-spacing:5px;min-height:30px;font-weight:700}
.shadeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(220px,68%)}
.shadeCell{aspect-ratio:1;border-radius:10px}
.tileGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(250px,78%)}
.tileCell{aspect-ratio:1;border-radius:10px;background:var(--raised);border:1px solid var(--border)}
.tileCell.lit{background:var(--warn);border-color:var(--warn)}
.glGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(210px,66%)}
.glCell{aspect-ratio:1;border-radius:12px;background:var(--raised);border:1px solid var(--border)}
.glCell.lit{background:var(--good);border-color:var(--good)}
.balloonWrap{height:150px;display:flex;align-items:center;justify-content:center}
.balloonC{border-radius:50%;background:var(--warn)}
.cardsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(290px,84%)}
.mcard{aspect-ratio:.85;border-radius:10px;background:var(--raised);border:1px solid var(--border);font-size:24px;display:flex;align-items:center;justify-content:center}
.mcard.open{background:#3A3A44;border-color:rgba(255,255,255,.3)}
.mcard.done{opacity:.25}
.penRow{display:flex;gap:10px}
.penBtn{font-size:24px;padding:13px 15px}
.diceShow{font-size:64px;line-height:1.2;font-weight:800}
/* match overlay */
.matchOverlay{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;background:rgba(12,12,15,.95)}
.moHalf{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;direction:rtl}
body.en .moHalf{direction:ltr}
.moHalf.moTop{transform:rotate(180deg);border-bottom:1px solid var(--border)}
.moEmoji{font-size:46px}
.moTitle{font-size:24px;font-weight:800}
.moScore{font-size:15px;color:var(--sub)}
.moBtns{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center}

:root{--bg:#15102f;--surface:#241d4a;--raised:#342960;--warn:#f8a529;--p1:#fb718f;--p2:#55c9f3}
#menu{background:radial-gradient(ellipse at 10% 10%,#385e8840,transparent 40%),radial-gradient(ellipse at 85% 15%,#773ab940,transparent 45%),var(--bg)}
.menuHead,.optBox,#gameList{max-width:1180px}.menuHead{padding:24px 8px}.menuHead h1{font-size:clamp(28px,4vw,46px)}
#gameList{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{position:relative;border-radius:24px;padding:22px;border-top:3px solid var(--accent,#f8a529);background:linear-gradient(140deg,#302856,#1c173b);box-shadow:0 12px 26px #07041644}
.cardIcon{font-size:42px;width:76px;height:76px;display:grid;place-items:center;border-radius:22px;background:radial-gradient(circle at 25% 25%,#ffffff22,#ffffff05);box-shadow:inset 0 0 20px #ffffff08}
.cardName{font-size:19px}.cardDesc{font-size:14px}.cardTag{color:#ede5ff;background:#76629b33}
.pad{background:radial-gradient(ellipse at center,#ffffff09,transparent 65%)}.padHuge{text-shadow:0 6px 30px #0005}.opt,.nrCell,.tileCell,.mcard{box-shadow:0 5px 0 #0003}
.half.bottom{background:radial-gradient(ellipse at 50% 80%,#fb718f22,transparent 70%)}.half.top{background:radial-gradient(ellipse at 50% 80%,#55c9f322,transparent 70%)}
#arcSearch{width:100%;padding:12px 16px;font:inherit;background:#15102f;color:white;border:1px solid #756791;border-radius:12px;user-select:text}
.arcFilters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.arcFilters button{padding:9px 14px;border-radius:12px;background:#342960;min-height:44px}.arcFilters .active{background:#f8a529;color:#20194f}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:99}.confetti i{position:absolute;top:-20px;width:9px;height:18px;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:.2}}
button:focus-visible,input:focus-visible{outline:3px solid #f8a529;outline-offset:3px}
@media(max-width:500px){#gameList{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}.cardName{font-size:16px}.cardDesc{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body oncontextmenu="return false">

<div id="menu" class="screen active">
  <header class="menuHead" id="menuHead"></header>
  <div class="optBox" id="langBox"></div>
  <div class="optBox" id="layoutBox"></div>
  <div id="gameList"></div>
  <div class="hint" id="hint"></div>
</div>

<div id="game" class="screen"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const faD='۰۱۲۳۴۵۶۷۸۹';
const urlParams=new URLSearchParams(location.search);
function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function read(k){try{return localStorage.getItem(k);}catch(e){return null;}}
let LANG=urlParams.get('lang')||read('duelLang')||'fa';
if(LANG!=='en')LANG='fa';
const L=(fa,en)=>LANG==='fa'?fa:en;
const toFa=n=>LANG==='fa'?String(n).replace(/\d/g,d=>faD[d]):String(n);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function el(tag,cls,html){const d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}
function applyLang(){
  document.documentElement.setAttribute('lang',LANG);
  document.documentElement.setAttribute('dir',LANG==='fa'?'rtl':'ltr');
  document.body.classList.toggle('en',LANG==='en');
  document.title=L('دوئل دو نفره | ۴۹ بازی لمسی روی یک صفحه','Two-Player Duel | 49 touch games on one screen');
}

const gameEl=$('#game');
let halfTop=null,halfBottom=null;
let timers=[],cleanups=[],wins=[0,0],target=5,matchOver=false,curId=null,LS=false;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function every(fn,ms){const t=setInterval(fn,ms);timers.push(t);return t;}
function clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t);});timers=[];}
function runCleanups(){cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];}
function vibrate(ms){if(navigator.vibrate){try{navigator.vibrate(ms);}catch(e){}}}
function computeLS(){
  const pref=urlParams.get('layout')||read('duelLayout')||'auto';
  if(pref==='portrait')return false;
  if(pref==='landscape')return true;
  return window.innerWidth>window.innerHeight;
}
function buildShell(){
  clearTimers();runCleanups();matchOver=false;
  gameEl.innerHTML='';
  halfTop=el('div','half top');
  halfBottom=el('div','half bottom');
  const divider=el('div','divider');
  gameEl.appendChild(halfTop);gameEl.appendChild(divider);gameEl.appendChild(halfBottom);
  const exit=el('button','fab exit','✕');
  exit.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();exitGame();});
  const pill=el('div','scorePill','<span id="sTop">0</span><i></i><span id="sBot">0</span>');
  gameEl.appendChild(exit);gameEl.appendChild(pill);
}
function renderScore(){$('#sTop').textContent=toFa(wins[1]);$('#sBot').textContent=toFa(wins[0]);}
function halfOf(p){return p===0?halfBottom:halfTop;}
function clearHalves(){halfTop.innerHTML='';halfBottom.innerHTML='';}
function pads(cls,html,onTap){
  const out=[];
  [halfBottom,halfTop].forEach((half,p)=>{
    const d=el('div','pad'+(cls?' '+cls:''),html);
    if(onTap)d.addEventListener('pointerdown',e=>{e.preventDefault();onTap(p,e,d);});
    half.appendChild(d);out.push(d);
  });
  return out;
}
function mkFlash(half,txt,ms){
  const f=el('div','flash',txt);half.appendChild(f);
  if(ms)later(()=>f.remove(),ms);
  return f;
}
function flashBoth(botTxt,topTxt,ms=1200){mkFlash(halfBottom,botTxt,ms);mkFlash(halfTop,topTxt,ms);}
function dualFlash(w,winTxt,loseTxt,ms=1200){flashBoth(w===0?winTxt:loseTxt,w===1?winTxt:loseTxt,ms);}
function addWin(p){
  wins[p]++;renderScore();vibrate(30);
  if(wins[p]>=target){matchOver=true;later(()=>endMatch(p),1200);return true;}
  return false;
}
function scoreRound(w,winTxt,loseTxt,next,delay=1400){clearTimers();dualFlash(w,winTxt,loseTxt);if(!addWin(w))later(next,delay);}
const PH={
  correct:()=>L('درست! ✅ +۱','Correct! ✅ +1'),
  oppFaster:()=>L('حریف زودتر زد!','Opponent got it first!'),
  lock:()=>L('اشتباه! قفل شدی 🔒','Wrong! You\'re locked 🔒'),
  bothWrong:()=>L('هر دو اشتباه! 😅','Both wrong! 😅'),
  wrongOpp:()=>L('اشتباه! ❌ +۱ حریف','Wrong! ❌ +1 opponent'),
  oppWrong:()=>L('حریف اشتباه زد! +۱ ✅','Opponent slipped! +1 ✅'),
  tie:()=>L('مساوی! 🤝','Tie! 🤝'),
  vs:()=>L('در برابر','vs'),
};
function tieRound(next,delay=1350){clearTimers();flashBoth(PH.tie(),PH.tie());later(next,delay);}
function endMatch(w){
  clearTimers();runCleanups();
  gameEl.querySelectorAll('.matchOverlay').forEach(x=>x.remove());
  const ov=el('div','matchOverlay');
  const mk=p=>{
    const won=p===w;
    const h=el('div','moHalf'+(p===1?' moTop':''));
    h.innerHTML=`<div class="moEmoji">${won?'🏆':'🤝'}</div><div class="moTitle" style="color:var(--p${p+1})">${won?L('بردی! 🎉','You win! 🎉'):L('باختی!','You lose!')}</div><div class="moScore">${L('نتیجه','Score')}: ${toFa(wins[p])} - ${toFa(wins[1-p])}</div><div class="moBtns"><button class="btn primary" data-a="again">${L('بازی دوباره 🔁','Play again 🔁')}</button><button class="btn" data-a="menu">${L('همهٔ بازی‌ها 🎮','All games 🎮')}</button></div>`;
    h.addEventListener('pointerdown',e=>{
      const b=e.target.closest('button');if(!b)return;e.preventDefault();
      if(b.dataset.a==='again')openGame(curId);else exitGame();
    });
    return h;
  };
  ov.appendChild(mk(1));ov.appendChild(mk(0));
  gameEl.appendChild(ov);
}
function openGame(id){
  const g=GAMES.find(x=>x.id===id);if(!g)return;
  curId=id;wins=[0,0];target=g.target;
  LS=computeLS();
  document.body.classList.toggle('landscape',LS);
  $('#menu').classList.remove('active');gameEl.classList.add('active');
  buildShell();renderScore();
  g.start();
}
function exitGame(){
  clearTimers();runCleanups();matchOver=false;
  gameEl.innerHTML='';gameEl.classList.remove('active');
  document.body.classList.remove('landscape');
  $('#menu').classList.add('active');
}
function optionRace({html,correct,wrongMode='lock',next,revealMs=1300}){
  let answered=false;const locked=[false,false];
  clearHalves();
  [halfBottom,halfTop].forEach((half,p)=>{
    const w=el('div','padWrap',html);
    w.addEventListener('pointerdown',e=>{
      const btn=e.target.closest('.opt');if(!btn)return;
      e.preventDefault();
      if(matchOver||answered||locked[p])return;
      const v=btn.dataset.v;
      if(v===String(correct)){
        answered=true;btn.classList.add('goodBtn');vibrate(20);
        scoreRound(p,PH.correct(),PH.oppFaster(),next,revealMs);
      }else if(wrongMode==='lock'){
        locked[p]=true;btn.classList.add('badBtn');
        mkFlash(halfOf(p),PH.lock(),850);
        if(locked[0]&&locked[1]){answered=true;later(()=>{if(matchOver)return;flashBoth(PH.bothWrong(),PH.bothWrong(),1000);later(next,1100);},900);}
      }else{
        answered=true;btn.classList.add('badBtn');
        scoreRound(1-p,PH.oppWrong(),PH.wrongOpp(),next,revealMs);
      }
    });
    half.appendChild(w);
  });
}

function startReaction(){
  function round(){
    if(matchOver)return;clearHalves();
    let state='wait';
    const ps=pads('wait',`<div class="padIcon">🚦</div><div class="padBig">${L('صبر کن...','Wait...')}</div><div class="padSub">${L('وقتی سبز شد، سریع بزن! اگه زودتر بزنی امتیاز به حریف می‌رسه.','When it turns green, tap fast! Tap early and your opponent gets the point.')}</div>`,(p)=>{
      if(matchOver)return;
      if(state==='wait'){
        state='hold';clearTimers();
        scoreRound(1-p,L('حریف زود زد! +۱ ✅','Opponent jumped early! +1 ✅'),L('زود زدی! ❌ +۱ حریف','Too early! ❌ +1 opponent'),round);
      }else if(state==='go'){
        state='hold';
        scoreRound(p,L('چه واکنشی! ⚡ +۱','What a reflex! ⚡ +1'),L('حریف سریع‌تر بود!','Opponent was faster!'),round);
      }
    });
    later(()=>{
      if(matchOver||state!=='wait')return;
      state='go';
      ps.forEach(d=>{d.classList.remove('wait');d.classList.add('go');d.innerHTML=`<div class="padIcon">🟢</div><div class="padHuge">${L('بزن!','TAP!')}</div>`;});
    },rnd(1500,5000));
  }
  round();
}

function startTiming(){
  function round(){
    if(matchOver)return;clearHalves();
    const hit=[null,null];let pos=0,dir=1;
    const ps=pads('tapzone',`<div class="padIcon">🎯</div><div class="tbar"><div class="tzoneC"></div><div class="tmark"></div></div><div class="padSub">${L('وقتی نشانگر رسید وسط ناحیهٔ سبز، ضربه بزن!','Tap when the marker is in the middle of the green zone!')}</div>`,(p)=>{
      if(matchOver||hit[p]!==null)return;
      hit[p]=Math.abs(pos-50);vibrate(15);
      mkFlash(halfOf(p),L('ثبت شد: ','Recorded: ')+toFa(Math.round(hit[p]))+L(' فاصله',' off'),800);
      if(hit[0]!==null&&hit[1]!==null)finish();
    });
    const iv=every(()=>{
      pos+=dir*2.1;
      if(pos>=100){pos=100;dir=-1;}if(pos<=0){pos=0;dir=1;}
      ps.forEach(d=>{const m=d.querySelector('.tmark');if(m)m.style.left=`calc(${pos}% - 3px)`;});
    },16);
    function finish(){
      clearInterval(iv);
      const w=hit[0]<=hit[1]?0:1;
      if(Math.abs(hit[0]-hit[1])<0.5){tieRound(round);return;}
      scoreRound(w,L('دقیق‌تر زدی! 🎯 +۱','More precise! 🎯 +1'),L('حریف دقیق‌تر بود!','Opponent was more precise!'),round);
    }
    later(()=>{if(matchOver)return;if(hit[0]===null||hit[1]===null){[0,1].forEach(p=>{if(hit[p]===null)hit[p]=100;});finish();}},12000);
  }
  round();
}
function startTap(){
  function round(){
    if(matchOver)return;clearHalves();
    const n=[0,0];let live=false,secs=10;
    const ps=pads('tapzone','',(p)=>{
      if(matchOver||!live)return;
      n[p]++;paint();
    });
    function paint(){
      ps.forEach((d,p)=>{d.innerHTML=`<div class="padSub">${L('زمان','Time')}: ${toFa(secs)}</div><div class="padHuge">${toFa(n[p])}</div><div class="padSub">${L('تندتند بزن!','Tap like crazy!')}</div>`;});
    }
    let cd=3;
    ps.forEach(d=>d.innerHTML=`<div class="padHuge">${toFa(cd)}</div>`);
    const civ=every(()=>{
      cd--;
      if(cd>0){ps.forEach(d=>d.innerHTML=`<div class="padHuge">${toFa(cd)}</div>`);}
      else{
        clearInterval(civ);live=true;paint();
        const siv=every(()=>{
          secs--;
          if(secs<=0){
            clearInterval(siv);live=false;
            if(n[0]===n[1]){tieRound(round);return;}
            const w=n[0]>n[1]?0:1;
            scoreRound(w,L('بردی! ','You win! ')+toFa(n[w])+' 👆 +۱',L('حریف بیشتر زد: ','Opponent tapped more: ')+toFa(n[1-w]),round);
          }else paint();
        },1000);
      }
    },800);
  }
  round();
}

function startSwipe(){
  function round(){
    if(matchOver)return;clearHalves();
    const amt=[0,0];let done=false;
    const last=[null,null];
    const ps=pads('tapzone',`<div class="padIcon">🧽</div><div class="swBarWrap"><div class="swBar"></div></div><div class="padSub">${L('انگشتت رو تندتند روی صفحه بکش تا نوار پر بشه!','Scrub your finger fast to fill the bar!')}</div>`);
    ps.forEach((d,p)=>{
      d.addEventListener('pointermove',e=>{
        if(matchOver||done)return;
        if(e.pointerType!=='touch'&&e.buttons===0)return;
        if(last[p]){
          const dx=e.clientX-last[p].x,dy=e.clientY-last[p].y;
          amt[p]+=Math.min(Math.hypot(dx,dy),40);
          const bar=d.querySelector('.swBar');if(bar)bar.style.width=Math.min(100,amt[p]/50)+'%';
          if(amt[p]>=5000){done=true;scoreRound(p,L('برق افتاد! ✨ +۱','Squeaky clean! ✨ +1'),L('حریف سریع‌تر سابید!','Opponent scrubbed faster!'),round);}
        }
        last[p]={x:e.clientX,y:e.clientY};
      });
      d.addEventListener('pointerup',()=>{last[p]=null;});
      d.addEventListener('pointerleave',()=>{last[p]=null;});
    });
  }
  round();
}

function startMath(){
  function round(){
    if(matchOver)return;
    const a=rnd(2,12),b=rnd(2,12),op=['+','×','-'][rnd(0,2)];
    const ans=op==='+'?a+b:op==='×'?a*b:a-b;

    const arr=shuffle([...opts]);
    optionRace({
      html:`<div class="qWrap"><div class="question">${toFa(a)} ${op} ${toFa(b)} = ؟</div><div class="optGrid">${arr.map(v=>`<button class="btn opt" data-v="${v}">${toFa(v)}</button>`).join('')}</div><div class="padSub qNote">${L('اولین جواب درست امتیاز می‌گیره — جواب غلط = قفل!','First correct answer scores — wrong = locked!')}</div></div>`,
      correct:ans,next:round
    });
  }
  round();
}

const SIMON_COLORS=[['#E97366','🔴'],['#5E9FE8','🔵'],['#72BC8F','🟢'],['#EAC26B','🟡']];
function startSimon(){
  let len=3;
  function round(){
    if(matchOver)return;clearHalves();
    const seq=[];for(let i=0;i<len;i++)seq.push(rnd(0,3));
    const ps=pads('',`<div class="padSub">${L('ترتیب رنگ‌ها رو حفظ کن...','Memorize the color order...')}</div><div class="simonShow"></div><div class="simonProg padSub"></div>`);
    let si=0;
    const iv=every(()=>{
      if(matchOver){clearInterval(iv);return;}
      if(si<seq.length){
        ps.forEach(d=>{const s=d.querySelector('.simonShow');if(s){s.style.background=SIMON_COLORS[seq[si]][0];s.style.opacity='1';later(()=>{s.style.opacity='.25';},440);}});
        si++;
      }else{clearInterval(iv);input();}
    },700);
    function input(){
      clearHalves();
      const prog=[0,0];let done=false;const locked=[false,false];

            e.preventDefault();
            if(matchOver||done||locked[p])return;
            if(ci===seq[prog[p]]){
              prog[p]++;vibrate(10);
              if(prog[p]>=seq.length){done=true;len=Math.min(len+1,7);scoreRound(p,L('حافظهٔ قوی! 🌈 +۱','Great memory! 🌈 +1'),L('حریف زودتر کاملش کرد!','Opponent completed it first!'),round);}
            }else{
              locked[p]=true;mkFlash(halfOf(p),PH.lock(),900);
              if(locked[0]&&locked[1]){done=true;later(()=>{if(matchOver)return;flashBoth(PH.bothWrong(),PH.bothWrong(),1000);later(round,1100);},950);}
            }
          });
          grid.appendChild(b);
        });
        inner.appendChild(grid);w.appendChild(inner);half.appendChild(w);
      });
    }
  }
  round();
}
function startPattern(){

function spawnRace({secs,spawnMs,life,makeDot,doneMsg}){
  // generic per-half spawn game; makeDot(chip,p,score) sets up chip; returns after time up: compare score
  clearHalves();
  const score=[0,0];let left=secs;
  const hud=[];
  [halfBottom,halfTop].forEach((half,p)=>{
    const h=el('div','trapHud');half.appendChild(h);hud.push(h);
  });
  function updateHud(){
    hud.forEach((h,p)=>{h.textContent=`${L('امتیاز','Score')}: ${toFa(score[p])} | ${L('زمان','Time')}: ${toFa(left)}`;});
  }
  updateHud();
  const spawner=every(()=>{
    if(matchOver)return;
    [halfBottom,halfTop].forEach((half,p)=>{
      const chip=el('button','trapDot');
      chip.style.left=rnd(5,75)+'%';chip.style.top=rnd(12,72)+'%';
      makeDot(chip,p,score,updateHud);
      half.appendChild(chip);
      later(()=>chip.remove(),life);
    });
  },spawnMs);
  const timer=every(()=>{
    left--;updateHud();
    if(left<=0){
      clearInterval(spawner);clearInterval(timer);
      gameEl.querySelectorAll('.trapDot').forEach(x=>x.remove());
      if(score[0]===score[1]){tieRound(()=>spawnRace({secs,spawnMs,life,makeDot,doneMsg}));return;}
      const w=score[0]>score[1]?0:1;
      scoreRound(w,doneMsg()+' '+toFa(score[w])+' +۱',L('حریف بیشتر جمع کرد: ','Opponent collected more: ')+toFa(score[1-w]),()=>spawnRace({secs,spawnMs,life,makeDot,doneMsg}));
    }
  },1000);
}

    ps.forEach((d,p)=>{
      const lab=d.querySelector('.holdT');
      let iv=null;
      d.addEventListener('pointerdown',e=>{
        e.preventDefault();
        if(matchOver||finished||t0[p]!==null||res[p]!==null)return;
        t0[p]=Date.now();
        iv=every(()=>{
          const s=(Date.now()-t0[p])/1000;
          if(lab)lab.textContent=s<2?toFa(s.toFixed(2)):L('؟؟؟','???');
        },50);
      });
      const up=e=>{
        if(matchOver||finished||t0[p]===null||res[p]!==null)return;
        const d5=Math.abs((Date.now()-t0[p])/1000-5);
        res[p]=d5;if(iv)clearInterval(iv);

        mkFlash(halfOf(p),L('فاصلهٔ تو: ','Your gap: ')+toFa(d5.toFixed(2))+L(' ثانیه',' s'),900);
        if(res[0]!==null&&res[1]!==null)finish();
      };
      d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);d.addEventListener('pointerleave',up);
    });
    function finish(){
      finished=true;
      if(Math.abs(res[0]-res[1])<0.005){tieRound(round);return;}
      const w=res[0]<res[1]?0:1;
      scoreRound(w,L('دقیق‌تر بودی! ⏱️ +۱','You were more precise! ⏱️ +1'),L('حریف دقیق‌تر بود!','Opponent was more precise!'),round);

    },14000);
  }
  round();
}

function startPong(){
  clearHalves();
  const cv=el('canvas','pongCv');
  gameEl.appendChild(cv);cleanups.push(()=>cv.remove());
  const ctx=cv.getContext('2d');
  let W=0,H=0;
  function resize(){W=cv.width=gameEl.clientWidth;H=cv.height=gameEl.clientHeight;}
  resize();window.addEventListener('resize',resize);cleanups.push(()=>window.removeEventListener('resize',resize));
  const mainSize=()=>LS?W:H,crossSize=()=>LS?H:W;
  const PW=110,PH=14,M=26,R=10;
  const pad=[{c:crossSize()/2},{c:crossSize()/2}];
  let bm=0,bc=0,vm=0,vc=0,running=false,msg=L('آماده؟','Ready?');
  function reset(dir){
    bm=mainSize()/2;bc=crossSize()/2;
    const sp=Math.max(4.2,mainSize()/160);
    vm=sp*dir;vc=(Math.random()*2-1)*sp*.7;
    running=false;msg=L('آماده؟','Ready?');
    later(()=>{running=true;msg='';},1100);
  }
  reset(rnd(0,1)?1:-1);
  cv.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch'&&e.buttons===0)return;
    const rect=cv.getBoundingClientRect();
    const x=e.clientX-rect.left,y=e.clientY-rect.top;
    const m=LS?x:y,c=LS?y:x;
    const p=m>mainSize()/2?0:1;
    pad[p].c=Math.max(PW/2,Math.min(crossSize()-PW/2,c));
  });
  cv.addEventListener('pointerdown',e=>{
    const rect=cv.getBoundingClientRect();
    const x=e.clientX-rect.left,y=e.clientY-rect.top;
    const m=LS?x:y,c=LS?y:x;
    const p=m>mainSize()/2?0:1;
    pad[p].c=Math.max(PW/2,Math.min(crossSize()-PW/2,c));
  });
  function point(w){
    running=false;
    if(addWin(w)){return;}
    msg=w===0?L('امتیاز صورتی! 🏓','Point pink! 🏓'):L('امتیاز آبی! 🏓','Point blue! 🏓');
    later(()=>reset(w===0?-1:1),1000);
  }
  const loop=every(()=>{
    if(matchOver){clearInterval(loop);return;}
    if(running){
      bm+=vm;bc+=vc;
      if(bc<R){bc=R;vc=-vc;}
      if(bc>crossSize()-R){bc=crossSize()-R;vc=-vc;}
      // paddle 0 at high-main side, paddle 1 at low-main side
      if(bm>mainSize()-M-PH-R&&bm<mainSize()-M&&vm>0&&Math.abs(bc-pad[0].c)<PW/2+R){vm=-vm*1.04;vc+=(bc-pad[0].c)*.06;bm=mainSize()-M-PH-R;}
      if(bm<M+PH+R&&bm>M&&vm<0&&Math.abs(bc-pad[1].c)<PW/2+R){vm=-vm*1.04;vc+=(bc-pad[1].c)*.06;bm=M+PH+R;}
      if(bm<-30)point(0);
      if(bm>mainSize()+30)point(1);
    }
    // draw
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.14)';
    if(LS){for(let y=0;y<H;y+=26)ctx.fillRect(W/2-1,y,2,14);}
    else{for(let x=0;x<W;x+=26)ctx.fillRect(x,H/2-1,14,2);}
    const drawPad=(p,color)=>{
      ctx.fillStyle=color;
      const m=p===0?mainSize()-M-PH:M;
      if(LS)ctx.fillRect(m,pad[p].c-PW/2,PH,PW);
      else ctx.fillRect(pad[p].c-PW/2,m,PW,PH);
    };
    drawPad(0,'#F2708A');drawPad(1,'#5E9FE8');
    ctx.fillStyle='#fff';ctx.beginPath();
    if(LS)ctx.arc(bm,bc,R,0,7);else ctx.arc(bc,bm,R,0,7);
    ctx.fill();
    if(msg){
      ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='700 20px sans-serif';ctx.textAlign='center';
      if(LS){ctx.fillText(msg,W/2,H/2-20);}
      else{
        ctx.save();ctx.translate(W/2,H/2+46);ctx.fillText(msg,0,0);ctx.restore();
        ctx.save();ctx.translate(W/2,H/2-46);ctx.rotate(Math.PI);ctx.fillText(msg,0,0);ctx.restore();
      }
    }
  },16);
}

function startC4(){

  function round(){

    const grid=Array(rows*cols).fill(null);let turn=starter;starter=1-starter;let over=false;
    const bd=el('div','c4Board');
    const turnT=el('div','tttTurn');gameEl.appendChild(turnT);cleanups.push(()=>turnT.remove());
    const turnB=el('div','tttTurn');turnB.style.top='6%';turnB.style.bottom='auto';turnB.style.transform=LS?'':'rotate(180deg)';gameEl.appendChild(turnB);cleanups.push(()=>turnB.remove());
    function paintTurn(){

      turnT.innerHTML=`<span style="color:var(--p${turn+1})">●</span> ${name}`;turnB.innerHTML=turnT.innerHTML;
    }
    paintTurn();
    const cells=[];
    for(let i=0;i<rows*cols;i++){
      const c=el('button','c4Cell');
      const col=i%cols;
      c.addEventListener('pointerdown',e=>{
        e.preventDefault();
        if(matchOver||over)return;
        let row=-1;
        for(let r=rows-1;r>=0;r--){if(grid[r*cols+col]===null){row=r;break;}}
        if(row<0)return;
        const idx=row*cols+col;
        grid[idx]=turn;cells[idx].classList.add('c4p'+turn);vibrate(10);
        const win=findC4(grid,rows,cols,idx,turn);
        if(win){
          over=true;win.forEach(x=>cells[x].classList.add('winCell'));
          later(()=>scoreRound(turn,L('چهارتایی! 🔵 +۱','Four in a row! 🔵 +1'),L('حریف ردیف کرد!','Opponent connected four!'),round),800);
        }else if(grid.every(x=>x!==null)){over=true;later(()=>tieRound(round),500);}
        else{turn=1-turn;paintTurn();}
      });
      bd.appendChild(c);cells.push(c);
    }
    gameEl.appendChild(bd);cleanups.push(()=>bd.remove());
  }
  function findC4(grid,rows,cols,idx,pl){
    const r0=Math.floor(idx/cols),c0=idx%cols;
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(const[dr,dc]of dirs){
      const line=[idx];
      for(const s of[1,-1]){
        let r=r0+dr*s,c=c0+dc*s;
        while(r>=0&&r<rows&&c>=0&&c<cols&&grid[r*cols+c]===pl){line.push(r*cols+c);r+=dr*s;c+=dc*s;}
      }
      if(line.length>=4)return line;
    }
    return null;
  }
  round();
}

    const size=[24,24];const state=[0,0]; // 0=idle 1=holding 2=done 3=popped

    const ps=pads('tapzone',`<div class="padSub">${L('نگه دار تا بادکنک بزرگ بشه — ولی قبل ترکیدن ول کن! بزرگ‌تر می‌بره.','Hold to inflate — release before it pops! Bigger balloon wins.')}</div><div class="balloonWrap"><div class="balloonC" style="width:24px;height:24px"></div></div><div class="padSub bstat"></div>`);
    ps.forEach((d,p)=>{
      const ball=d.querySelector('.balloonC');
      const stat=d.querySelector('.bstat');
      let iv=null;
      d.addEventListener('pointerdown',e=>{
        e.preventDefault();
        if(matchOver||finished||state[p]!==0)return;
        state[p]=1;
        iv=every(()=>{
          if(state[p]!==1)return;
          size[p]+=2.2;
          if(ball){ball.style.width=size[p]+'px';ball.style.height=size[p]+'px';}
          if(size[p]>=popAt){
            state[p]=3;clearInterval(iv);
            if(ball){ball.style.background='transparent';ball.textContent='💥';ball.style.fontSize='40px';}
            vibrate(80);
            if(stat)stat.textContent=L('ترکید!','Popped!');
            check();
          }
        },60);
      });
      const up=e=>{
        if(matchOver||finished||state[p]!==1)return;
        state[p]=2;if(iv)clearInterval(iv);
        if(stat)stat.textContent=L('ثبت شد ✓','Locked ✓');
        check();
      };
      d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);d.addEventListener('pointerleave',up);
    });
    function check(){
      if(state[0]<2||state[1]<2)return;
      finished=true;
      later(()=>{
        const pop0=state[0]===3,pop1=state[1]===3;
        if(pop0&&pop1){tieRound(round);return;}
        let w;
        if(pop0)w=1;else if(pop1)w=0;
        else{
          if(Math.abs(size[0]-size[1])<1){tieRound(round);return;}
          w=size[0]>size[1]?0:1;
        }
        scoreRound(w,L('بادکنک بزرگ‌تر! 🎈 +۱','Bigger balloon! 🎈 +1'),L('باختی این دست رو! 💥','You lost this one! 💥'),round);
      },600);
    }
    later(()=>{
      if(matchOver||finished)return;
      [0,1].forEach(p=>{if(state[p]<2)state[p]=state[p]===1?2:2;});
      check();
    },15000);
  }
  round();
}
function startPairs(){
  function round(){
    if(matchOver)return;clearHalves();
    const icons=shuffle(EMOJI_POOL.slice()).slice(0,4);
    const deck=shuffle([...icons,...icons]);
    let done=false;
    [halfBottom,halfTop].forEach((half,p)=>{
      const w=el('div','padWrap');
      const inner=el('div','qWrap',`<div class="padSub">${L('جفت‌ها رو پیدا کن! اولین نفری باش که هر ۴ جفت رو جمع می‌کنه','Find the pairs! First to match all 4 wins')}</div>`);
      const grid=el('div','cardsGrid');
      let open=[];let matched=0;let busy=false;
      deck.forEach((ic,i)=>{
        const b=el('button','mcard','❓');
        b.dataset.i=i;
        b.addEventListener('pointerdown',e=>{
          e.preventDefault();
          if(matchOver||done||busy)return;
          if(b.classList.contains('open')||b.classList.contains('done'))return;
          b.classList.add('open');b.textContent=ic;vibrate(8);
          open.push({b,ic});
          if(open.length===2){
            busy=true;
            const[x,y]=open;
            later(()=>{
              if(x.ic===y.ic){
                x.b.classList.add('done');y.b.classList.add('done');matched++;
                if(matched>=4&&!done){done=true;scoreRound(p,L('همه رو جفت کردی! 🎴 +۱','All matched! 🎴 +1'),L('حریف زودتر جفت کرد!','Opponent matched them first!'),round);}
              }else{[x,y].forEach(o=>{o.b.classList.remove('open');o.b.textContent='❓';});}
              open=[];busy=false;
            },550);
          }
        });
        grid.appendChild(b);
      });
      inner.appendChild(grid);w.appendChild(inner);half.appendChild(w);
    });
  }
  round();
}

 ['all',...Object.keys(TAGS)].forEach(k=>{const b=document.createElement('button');b.textContent=k==='all'?L('همه','All'):L(...TAGS[k]);b.classList.toggle('active',k===tag);b.onclick=()=>{tag=k;box.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');apply()};box.querySelector('.arcFilters').appendChild(b)});input.oninput=apply;apply();

endMatch=function(w){originalEndMatch(w);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=document.createElement('div');layer.className='confetti';for(let i=0;i<50;i++){const particle=document.createElement('i');particle.style.left=(Math.random()*100)+'%';particle.style.background=['#f8a529','#55c9f3','#fb718f','#a8e6cf'][i%4];particle.style.animationDelay=(Math.random()*.35)+'s';layer.appendChild(particle)}gameEl.appendChild(layer);later(()=>layer.remove(),2300)};
