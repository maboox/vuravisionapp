name: Android CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform/build tools
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Normalize debug artifact name
        run: cp app/build/outputs/apk/debug/app-debug.apk VuraVision-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VuraVision-debug
          path: VuraVision-debug.apk
      - name: Decode release keystore
        if: env.KEYSTORE_B64 != ''
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vuravision-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vuravision-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify signed APK
        if: env.KEYSTORE_B64 != ''
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk VuraVision-release.apk
      - name: Upload signed release APK
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: VuraVision-release
          path: VuraVision-release.apk
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
