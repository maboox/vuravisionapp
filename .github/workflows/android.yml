name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Override v3's obsolete default: tools platform-tools.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vuravision-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vuravision-release.jks" >> "$GITHUB_ENV"
          else
            echo '::error::ANDROID_KEYSTORE_BASE64 is required for a production APK.'
            exit 1
          fi
      - name: Test and build pull request (no signing secrets)
        if: github.event_name == 'pull_request'
        run: bash ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Build, test, and lint production APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for setting in ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!setting}" ]; then
              echo "::error::$setting is required for production signing."
              exit 1
            fi
          done
          bash ./gradlew --no-daemon --stacktrace validateReleaseSigning testDebugUnitTest lintRelease assembleRelease assembleDebugAndroidTest
      - name: Read app version
        run: echo "APP_VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_ENV"
      - name: Verify APK
        run: |
          mkdir -p artifacts
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            APK=app/build/outputs/apk/debug/app-debug.apk
            OUTPUT=VuraVision-$APP_VERSION-debug.apk
          else
            APK=app/build/outputs/apk/release/app-release.apk
            OUTPUT=VuraVision-$APP_VERSION.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          python3 scripts/check-apk.py "$APK" > artifacts/native-alignment.json
          cp "$APK" "artifacts/$OUTPUT"
          cd artifacts
          sha256sum "$OUTPUT" > SHA256SUMS.txt
      # Every signed build gets a pre-release with a stable APK download link.
      # Release files do not count against the Actions artifact storage quota.
      - name: Publish APK as a pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}-build${{ github.run_number }}"
          # Robolectric screenshots let reviewers check layouts without a device.
          (cd app/build/qa && zip -q "$GITHUB_WORKSPACE/artifacts/screenshots.zip" *.png) || true
          gh release create "$TAG" artifacts/*.apk artifacts/SHA256SUMS.txt $(ls artifacts/screenshots.zip 2>/dev/null) \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "VuraVision ${APP_VERSION} · build ${{ github.run_number }}" \
            --notes "Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}"
          echo "APK: https://github.com/${{ github.repository }}/releases/download/$TAG/VuraVision-${APP_VERSION}.apk" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: VuraVision-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/qa/
          retention-days: 3
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vuravision-release.jks"
  device-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Override v3's obsolete default: tools platform-tools.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 instrumented PDF and Keystore checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-source.py
